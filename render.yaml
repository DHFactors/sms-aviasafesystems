services:
  - type: web
    name: aviasafe-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    workingDir: backend
    envVars:
      - key: REDIS_URL
        sync: false
      - key: REDIS_ENABLED
        value: "true"
      - key: ENVIRONMENT
        value: "production"
      - key: FIREBASE_DATABASE_ID
        value: sms-db
