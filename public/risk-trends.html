<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk &amp; Trends — AviaSAFE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/shell.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/styles/global.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="js/chart-theme.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #f1f5f9; color: #0b2a42; min-height: 100vh; }
        #pageContent { display: none; }
        .page-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
        .page-header h2 { margin: 0; color: #0b2a42; }
        .section-title { font-size: 1.25rem; font-weight: 600; color: #0b2a42; margin: 1.5rem 0 1rem; display: flex; align-items: center; gap: 0.5rem; }
        .section-title:first-of-type { margin-top: 0; }
        .filter-bar { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem; background: #fff; padding: 0.75rem 1.25rem; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .filter-bar label { font-size: 0.85rem; font-weight: 500; color: #0b2a42; }
        .filter-bar select { padding: 0.4rem 0.75rem; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 0.85rem; background: #fff; cursor: pointer; }
        .btn-refresh { margin-left: auto; background: #1a6b8a; color: #fff; border: none; padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: background 0.15s; }
        .btn-refresh:hover { background: #0b2a42; }
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
        @media (max-width: 860px) { .chart-grid { grid-template-columns: 1fr; } }
        .chart-card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); padding: 1.25rem; }
        .chart-card h3 { font-size: 0.85rem; font-weight: 600; color: #0b2a42; margin-bottom: 1rem; }
        .chart-wrapper { position: relative; }
        .chart-full { grid-column: 1 / -1; }
        .chart-container { position: relative; width: 100%; max-width: 100%; height: 350px; }
        .chart-container > canvas { display: block; width: 100% !important; height: 100% !important; max-width: 100%; }
        .chart-full .chart-container { height: 400px; }
        .state-container { position: relative; min-height: 100px; }
        .state-loading::before { content: ''; position: absolute; inset: 0; background: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; z-index: 1; }
        .state-loading::after { content: 'Loading...'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 0.9rem; z-index: 2; }
        .state-empty, .state-error { display: flex; align-items: center; justify-content: center; padding: 3rem 1rem; }
        .state-empty canvas, .state-error canvas { display: none; }
        .state-empty .empty-msg, .state-error .error-msg { font-size: 0.9rem; color: #64748b; }
        .state-error .error-msg { color: #dc3545; }
    </style>

    <link rel="stylesheet" href="css/theme.css">
    </head>
<body>

<div class="app-shell">
    <div id="pageContent">

        <div id="risk-trends-section" class="dashboard-view" data-dashboard-view>

        <div class="page-header">
            <h2><i class="fas fa-chart-bar"></i> Risk &amp; Trends</h2>
            <a href="/safety.html" class="btn btn-outline btn-sm"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>

        <div class="filter-bar">
            <label for="daysFilter"><i class="fas fa-calendar-alt"></i> Period:</label>
            <select id="daysFilter">
                <option value="30">Last 30 Days</option>
                <option value="60" selected>Last 60 Days</option>
                <option value="90">Last 90 Days</option>
                <option value="180">Last 180 Days</option>
                <option value="365">Last 365 Days</option>
            </select>
            <button id="refreshBtn" class="btn-refresh"><i class="fas fa-rotate"></i> Refresh</button>
        </div>

        <div class="section-title"><i class="fas fa-chart-simple"></i> Risk Distribution</div>
        <div class="chart-grid">
            <div class="chart-card">
                <h3>Risk Distribution</h3>
                <div id="riskChart" class="chart-wrapper state-container">
                    <div class="chart-container" style="position: relative; width: 100%; max-width: 100%; height: 350px;">
                        <canvas id="riskChartCanvas"></canvas>
                    </div>
                </div>
            </div>
            <div class="chart-card">
                <h3>Monthly Trends</h3>
                <div id="trendChart" class="chart-wrapper state-container">
                    <div class="chart-container" style="position: relative; width: 100%; max-width: 100%; height: 350px;">
                        <canvas id="trendChartCanvas"></canvas>
                    </div>
                </div>
            </div>
        </div>

        </div>

    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="/js/firebase.js?v=4.0.1"></script>
<script>
window.SHELL_CONFIG = {
    brand: 'AviaSAFE',
    roleLabel: 'Operator Safety Dashboard',
    nav: [
        { href: '/safety.html', label: 'Key Indicators', icon: 'fa-chart-simple' },
        { href: '/dashboard/sms-maturity.html', label: 'SMS Maturity', icon: 'fa-heart-pulse' },
        { href: '/risk-trends.html', label: 'Risk & Trends', icon: 'fa-chart-bar' },
        { href: '/top-hazards.html', label: 'Top Hazards', icon: 'fa-triangle-exclamation' },
        { href: '/dashboard/nhrc-kpis.html', label: 'N-HRC KPIs', icon: 'fa-triangle-exclamation' },
        { href: '/dashboard/spi-dashboard.html', label: 'SPI/SPT', icon: 'fa-gauge-high' },
        { href: '/settings/team.html', label: 'Team', icon: 'fa-users-gear', roles: ['AIRLINE_ADMIN', 'TENANT_ADMIN', 'DEPT_ADMIN'] },
        { href: '/administration.html', label: 'Administration', icon: 'fa-user-gear', roles: ['AIRLINE_ADMIN', 'TENANT_ADMIN'] },
    ],
};
</script>
<script src="/js/api/client.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/dashboard-nav.js"></script>
<script src="/js/api/dashboard.js"></script>
<script src="/js/dashboard-utils.js"></script>
<script>
let chartInstances = {};
let currentDays = 90;

function safeArray(data) {
    return Array.isArray(data) ? data : [];
}

document.addEventListener('DOMContentLoaded', async () => {
    await waitForFirebase();
    const session = await getCurrentUser();
    if (!session) { window.location.href = '/login.html'; return; }
    if (session.role !== 'AIRLINE_ADMIN' && session.role !== 'CAAN_SMD' && session.role !== 'SUPER_ADMIN') {
        window.location.href = '/login.html';
        return;
    }
    if (typeof window.updateShellTenant === 'function') {
        const tenantName = session.tenantId ? session.tenantId.toUpperCase() : 'Cross-Tenant Safety Overview';
        window.updateShellTenant(tenantName, session.tenantId ? 'Safety Dashboard · ICAO operator' : 'State-level aggregated view');
    }
    document.getElementById('pageContent').style.display = 'block';

    const daysEl = document.getElementById('daysFilter');
    if (daysEl) {
        currentDays = parseInt(daysEl.value, 10);
        daysEl.addEventListener('change', () => {
            currentDays = parseInt(daysEl.value, 10);
            loadAll();
        });
    }
    document.getElementById('refreshBtn').addEventListener('click', loadAll);
    loadAll();
});

async function loadAll() {
    await Promise.all([
        loadRiskDistribution(),
        loadMonthlyTrends(),
    ]);
}

async function loadRiskDistribution() {
    const el = document.getElementById('riskChart');
    setLoading(el);
    try {
        const data = safeArray(await DashboardAPI.getRiskDistribution(currentDays));
        if (data.length === 0) {
            destroyChart('riskChartCanvas');
            setEmpty(el, 'No risk events recorded for the selected period');
            return;
        }
        setReady(el);
        renderRiskChart(data);
    } catch (err) {
        destroyChart('riskChartCanvas');
        setError(el, 'Unable to load risk distribution. Please try again.');
        console.error('loadRiskDistribution failed:', err);
    }
}

async function loadMonthlyTrends() {
    const el = document.getElementById('trendChart');
    setLoading(el);
    try {
        const data = safeArray(await DashboardAPI.getMonthlyTrends(currentDays * 2 > 730 ? 730 : currentDays * 2));
        if (data.length === 0) {
            destroyChart('trendChartCanvas');
            setEmpty(el, 'No risk trends recorded for the selected period');
            return;
        }
        setReady(el);
        renderTrendChart(data);
    } catch (err) {
        destroyChart('trendChartCanvas');
        setError(el, 'Unable to load trend data. Please try again.');
        console.error('loadMonthlyTrends failed:', err);
    }
}

function renderRiskChart(data) {
    destroyChart('riskChartCanvas');
    const ctx = document.getElementById('riskChartCanvas');
    if (!ctx) return;
    if (window.Chart && typeof Chart.getChart === 'function') {
        const orphan = Chart.getChart(ctx);
        if (orphan) { try { orphan.destroy(); } catch (_) {} }
    }

    const counts = { Low: 0, High: 0, 'Very High': 0 };
    for (const d of data) {
        const level = typeof normalizeRiskLevel === 'function' ? normalizeRiskLevel(d.risk_level) : d.risk_level;
        if (counts.hasOwnProperty(level)) counts[level] = d.count;
    }
    const labels = ICAO_RISK_LABELS;
    const vals = labels.map(l => counts[l] || 0);
    const colors = labels.map(l => ICAO_COLORS[l]);

    chartInstances['riskChartCanvas'] = new Chart(ctx, {
        type: 'bar',
        data: {
            labels,
            datasets: [{
                label: 'Reports',
                data: vals,
                backgroundColor: colors,
                borderRadius: 4,
            }],
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                tooltip: {
                    callbacks: {
                        label: (ctx) => `${ctx.parsed.y} (${data[ctx.dataIndex]?.percentage || 0}%)`,
                    },
                },
                legend: { display: false },
            },
            scales: {
                y: { beginAtZero: true, ticks: { precision: 0 } },
            },
        },
    });
}

function renderTrendChart(data) {
    destroyChart('trendChartCanvas');
    const ctx = document.getElementById('trendChartCanvas');
    if (!ctx) return;
    if (window.Chart && typeof Chart.getChart === 'function') {
        const orphan = Chart.getChart(ctx);
        if (orphan) { try { orphan.destroy(); } catch (_) {} }
    }

    chartInstances['trendChartCanvas'] = new Chart(ctx, {
        type: 'line',
        data: {
            labels: data.map(d => `${d.month}/${d.year}`),
            datasets: [
                { label: 'Total', data: data.map(d => d.total), borderColor: '#1a6b8a', fill: false, tension: 0.3 },
                { label: 'Voluntary', data: data.map(d => d.voluntary), borderColor: '#28a745', fill: false, tension: 0.3 },
                { label: 'Mandatory', data: data.map(d => d.mandatory), borderColor: '#dc3545', fill: false, tension: 0.3 },
                { label: 'High Risk', data: data.map(d => d.high_risk), borderColor: '#fd7e14', fill: false, tension: 0.3, borderDash: [5, 5] },
            ],
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: { beginAtZero: true, ticks: { precision: 0 } },
            },
        },
    });
}

function destroyChart(key) {
    const inst = chartInstances[key];
    if (inst) {
        try { inst.destroy(); } catch (_) {}
        delete chartInstances[key];
    }
    // Legacy alias: risk/trend stored under short keys in older code
    const legacyMap = { 'riskChartCanvas': 'risk', 'trendChartCanvas': 'trend' };
    const legacy = legacyMap[key];
    if (legacy && chartInstances[legacy]) {
        try { chartInstances[legacy].destroy(); } catch (_) {}
        delete chartInstances[legacy];
    }
    const canvas = document.getElementById(key);
    if (canvas && window.Chart && typeof Chart.getChart === 'function') {
        const orphan = Chart.getChart(canvas);
        if (orphan) { try { orphan.destroy(); } catch (_) {} }
    }
}

function setLoading(el) {
    el.dataset.state = 'loading';
    el.classList.remove('state-ready', 'state-empty', 'state-error');
    el.classList.add('state-loading');
}

function setReady(el) {
    el.dataset.state = 'ready';
    el.classList.remove('state-loading', 'state-empty', 'state-error');
    el.classList.add('state-ready');
}

function setEmpty(el, msg) {
    el.dataset.state = 'empty';
    el.classList.remove('state-loading', 'state-ready', 'state-error');
    el.classList.add('state-empty');
    if (!el.querySelector('.empty-msg')) {
        const p = document.createElement('p');
        p.className = 'empty-msg';
        p.textContent = msg;
        el.appendChild(p);
    }
}

function setError(el, msg) {
    el.dataset.state = 'error';
    el.classList.remove('state-loading', 'state-ready', 'state-empty');
    el.classList.add('state-error');
    let errEl = el.querySelector('.error-msg');
    if (!errEl) {
        errEl = document.createElement('p');
        errEl.className = 'error-msg';
        el.appendChild(errEl);
    }
    errEl.textContent = msg;
}
</script>

</body>
</html>
