<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master CAN Register - AviaSAFE</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f1f5f9; font-family: 'Inter', system-ui, -apple-system, sans-serif; color: #0b2a42; margin: 0; }
        .page { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        .nav { background: #0b2a42; color: #fff; padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .nav h1 { font-size: 1.1rem; font-weight: 600; margin: 0; }
        .nav h1 i { margin-right: 0.5rem; }
        .nav-actions { display: flex; align-items: center; gap: 1rem; }
        .nav-actions span { font-size: 0.8rem; opacity: 0.8; }
        .btn-logout { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
        .btn-logout:hover { background: rgba(255,255,255,0.1); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
        .header-bar h2 { margin: 0; color: #0b2a42; }
        .filter-bar { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; background: #fff; padding: 1rem 1.25rem; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 1.5rem; }
        .filter-bar label { font-size: 0.8rem; font-weight: 600; color: #475569; }
        .filter-bar select, .filter-bar input { padding: 0.4rem 0.75rem; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 0.85rem; background: #fff; }
        .filter-bar .btn-search { background: #1a6b8a; color: #fff; border: none; padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
        .table-card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow: hidden; }
        .table-card table { width: 100%; border-collapse: collapse; }
        .table-card th { background: #f8fafc; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; padding: 0.85rem 1rem; text-align: left; border-bottom: 2px solid #e2e8f0; }
        .table-card td { padding: 0.75rem 1rem; border-bottom: 1px solid #f1f5f9; font-size: 0.875rem; }
        .table-card tbody tr { cursor: pointer; }
        .table-card tbody tr:hover { background: #f8fafc; }
        .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
        .badge-critical { background: #fde8e8; color: #dc3545; }
        .badge-high { background: #fff3e0; color: #e65100; }
        .badge-medium { background: #fff8e1; color: #f9a825; }
        .badge-low { background: #e8f5e9; color: #2e7d32; }
        .badge-default { background: #f1f5f9; color: #64748b; }
        .badge-new { background: #e3f2fd; color: #1565c0; }
        .badge-processing { background: #fff3e0; color: #e65100; }
        .badge-warning { background: #fef3c7; color: #d97706; }
        .badge-completed { background: #e8f5e9; color: #2e7d32; }
        .badge-danger { background: #fde8e8; color: #b91c1c; }
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-card { background: #fff; padding: 1rem; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); text-align: center; }
        .stat-card .num { font-size: 1.5rem; font-weight: 700; color: #0b2a42; }
        .stat-card .lbl { font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.3px; margin-top: 0.25rem; }
        .stat-card .sub { font-size: 0.7rem; color: #94a3b8; margin-top: 0.15rem; }
        .loading-state { display: flex; align-items: center; justify-content: center; padding: 3rem; color: #64748b; }
        .loading-state i { font-size: 1.5rem; margin-right: 0.5rem; }
        .empty-state { text-align: center; padding: 3rem; color: #64748b; }
        @media (max-width: 768px) { .filter-bar { flex-direction: column; align-items: stretch; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/theme.css">
    </head>
<body>

<nav class="nav">
    <h1><i class="fas fa-clipboard-check"></i> Master CAN Register</h1>
    <div class="nav-actions">
        <span id="userDisplay"></span>
        <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
</nav>

<div class="page">
    <div class="header-bar">
        <h2><i class="fas fa-list"></i> Master CAN Register</h2>
        <div>
            <a href="/hazards/index.html" class="btn btn-outline btn-sm"><i class="fas fa-exclamation-triangle"></i> Master Hazard Register</a>
            <a href="/dashboard/responsible-manager.html" class="btn btn-outline btn-sm"><i class="fas fa-user-tie"></i> My Tasks</a>
        </div>
    </div>

    <div id="statsRow" class="stats-row"></div>

    <div class="filter-bar">
        <label>Status:</label>
        <select id="filterStatus"><option value="">All</option></select>
        <label>Priority:</label>
        <select id="filterPriority"><option value="">All</option></select>
        <label>Search:</label>
        <input type="text" id="filterSearch" placeholder="CAN reference or title..." style="flex:1;min-width:150px;">
        <button class="btn-search" onclick="loadCans()"><i class="fas fa-search"></i> Search</button>
    </div>

    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th>CAN Ref</th>
                    <th>Title</th>
                    <th>Hazard ID</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Assigned To</th>
                    <th>Target Date</th>
                    <th>Issued At</th>
                </tr>
            </thead>
            <tbody id="cansBody"></tbody>
        </table>
        <div id="loadingIndicator" class="loading-state" style="display:none;">
            <i class="fas fa-spinner fa-spin"></i> Loading CANs...
        </div>
        <div id="emptyIndicator" class="empty-state" style="display:none;">
            <i class="fas fa-inbox" style="font-size:2rem;margin-bottom:0.5rem;"></i>
            <p>No CANs found.</p>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="/js/firebase.js"></script>
<script src="/js/api/client.js"></script>
<script src="/js/can_cap.js"></script>
<script>
let currentUser = null;

firebase.auth().onAuthStateChanged(function(user) {
    if (!user) { window.location.href = '/login.html'; return; }
    currentUser = user;
    document.getElementById('userDisplay').textContent = user.email;
    populateFilters();
    loadCans();
    loadStats();
});

function populateFilters() {
    const statusSel = document.getElementById('filterStatus');
    CAN_STATUSES.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        statusSel.appendChild(opt);
    });
    const priSel = document.getElementById('filterPriority');
    CAN_PRIORITIES.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p; opt.textContent = p;
        priSel.appendChild(opt);
    });
}

function getFilters() {
    return {
        status: document.getElementById('filterStatus').value,
        priority: document.getElementById('filterPriority').value,
        search: document.getElementById('filterSearch').value,
    };
}

async function loadCans() {
    const tbody = document.getElementById('cansBody');
    const loading = document.getElementById('loadingIndicator');
    const empty = document.getElementById('emptyIndicator');
    tbody.innerHTML = '';
    loading.style.display = 'flex';
    empty.style.display = 'none';

    try {
        const data = await CanCapAPI.listCans(getFilters());
        loading.style.display = 'none';
        if (!data || data.length === 0) {
            empty.style.display = 'block';
            return;
        }
        data.forEach(c => {
            const tr = document.createElement('tr');
            tr.style.cursor = 'pointer';
            tr.addEventListener('click', () => {
                window.location.href = `/can_cap/can_detail.html?id=${c.id}`;
            });
            const priClass = canPriorityBadgeClass(c.priority);
            const statClass = canStatusBadgeClass(c.status);
            tr.innerHTML = `
                <td><strong>${c.can_reference}</strong></td>
                <td>${c.title}</td>
                <td>${c.hazard_id}</td>
                <td><span class="badge ${priClass}">${c.priority}</span></td>
                <td><span class="badge ${statClass}">${c.status}</span></td>
                <td>${c.assigned_to || '-'}</td>
                <td>${formatCanDate(c.target_completion_date)}</td>
                <td>${formatCanDate(c.issued_at)}</td>
            `;
            tbody.appendChild(tr);
        });
    } catch (err) {
        loading.style.display = 'none';
        const message = (err && err.message) || 'Unable to load the CAN register. Please try again.';
        console.error('loadCans failed:', err);
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:#dc3545;padding:2rem;"><i class="fas fa-exclamation-circle"></i> ${message}</td></tr>`;
    }
}

async function loadStats() {
    try {
        const stats = await CanCapAPI.getStats();
        const container = document.getElementById('statsRow');
        const canStatuses = (stats.cans && stats.cans.by_status) || {};
        const capTotal = (stats.caps && stats.caps.total) || 0;
        const canTotal = (stats.cans && stats.cans.total) || 0;
        container.innerHTML = Object.entries(canStatuses).map(([k, v]) =>
            `<div class="stat-card"><div class="num">${v}</div><div class="lbl">CAN ${k}</div></div>`
        ).join('') +
            `<div class="stat-card"><div class="num">${capTotal}</div><div class="lbl">CAP ACTIONS (${capTotal})</div><div class="sub">Linked across ${canTotal} CANs</div></div>` +
            `<div class="stat-card"><div class="num">${canTotal}</div><div class="lbl">Total CANs</div></div>`;
    } catch (e) { console.error('Stats error:', e); }
}

async function logout() {
    try { await firebase.auth().signOut(); window.location.href = '/'; }
    catch (e) { console.error(e); }
}
</script>
</body>
</html>
