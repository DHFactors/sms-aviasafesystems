<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit CAP - AviaSAFE</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f1f5f9; font-family: 'Inter', system-ui, -apple-system, sans-serif; color: #0b2a42; margin: 0; }
        .page { max-width: 700px; margin: 0 auto; padding: 1.5rem; }
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: #1a6b8a; font-size: 0.875rem; margin-bottom: 1rem; text-decoration: none; }
        .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); padding: 1.5rem; margin-bottom: 1.25rem; }
        .card h2 { font-size: 1rem; color: #0b2a42; margin: 0 0 1rem; display: flex; align-items: center; gap: 0.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: #475569; margin-bottom: 0.25rem; }
        .form-group label .required { color: #dc3545; margin-left: 2px; }
        .form-control { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.9rem; box-sizing: border-box; }
        .form-control:focus { outline: none; border-color: #1a6b8a; box-shadow: 0 0 0 3px rgba(26,107,138,0.1); }
        textarea.form-control { min-height: 80px; resize: vertical; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .btn-submit { background: #0b2a42; color: #fff; border: none; padding: 0.75rem 2rem; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-submit:hover { opacity: 0.9; }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        #message { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; display: none; font-size: 0.85rem; }
        #message.success { display: block; background: #e6f4ea; color: #1e7e34; border-left: 4px solid #34a853; }
        #message.error { display: block; background: #fce8e6; color: #d33426; border-left: 4px solid #ea4335; }
        .can-info { background: #f0f4ff; border-left: 4px solid #1a6b8a; padding: 1rem; border-radius: 6px; margin-bottom: 1.5rem; }
        .can-info h4 { margin: 0 0 0.5rem; font-size: 0.9rem; color: #0b2a42; }
        .can-info p { margin: 0; font-size: 0.85rem; color: #475569; }
        select.form-control { appearance: auto; }
        .risk-preview { background: #f0f4ff; border: 1px solid #dbe7f5; border-radius: 6px; padding: 0.6rem 0.9rem; font-size: 0.85rem; color: #475569; margin-top: 0.4rem; }
        .risk-preview strong { color: #0b2a42; }
        .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
        .badge-low { background: #e8f5e9; color: #2e7d32; }
        .badge-medium { background: #fff8e1; color: #f9a825; }
        .badge-high { background: #fff3e0; color: #e65100; }
        .badge-critical { background: #fde8e8; color: #dc3545; }
        .badge-default { background: #f1f5f9; color: #64748b; }
        @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="page">
    <a href="/can_cap/cans.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to CANs</a>
    <div id="message"></div>

    <div class="card">
        <h2><i class="fas fa-tasks"></i> Submit Corrective Action Plan</h2>

        <div id="canInfo" class="can-info" style="display:none;">
            <h4 id="canRefTitle"></h4>
            <p id="canDescription"></p>
        </div>

        <form id="capForm" onsubmit="return false;">
            <div class="form-group">
                <label>Action Plan <span class="required">*</span></label>
                <textarea class="form-control" id="fieldActionPlan" required minlength="10" placeholder="Detailed description of the corrective action plan"></textarea>
            </div>

            <div class="form-group">
                <label>Timeline <span class="required">*</span></label>
                <textarea class="form-control" id="fieldTimeline" required placeholder="Milestones and key dates for implementation"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Target Completion Date <span class="required">*</span></label>
                    <input class="form-control" id="fieldTargetDate" type="date" required>
                </div>
                <div class="form-group">
                    <label>Resources Required</label>
                    <input class="form-control" id="fieldResources" placeholder="e.g., Budget, personnel, equipment">
                </div>
            </div>

            <div class="form-group">
                <label>Implementation Plan</label>
                <textarea class="form-control" id="fieldImplPlan" placeholder="Step-by-step implementation approach"></textarea>
            </div>

            <div class="form-group">
                <label>Root Cause Analysis (RCA)</label>
                <textarea class="form-control" id="fieldRca" placeholder="Root cause / contributing factors identified (FORM SMSM 8.8.2)"></textarea>
            </div>

            <div class="form-group">
                <label>Process Owner</label>
                <input class="form-control" id="fieldProcessOwner" placeholder="Owner accountable for implementing and sustaining this action">
            </div>

            <div style="font-size:0.95rem;font-weight:600;color:#0b2a42;margin:0.5rem 0 1rem;display:flex;align-items:center;gap:0.5rem;">
                <i class="fas fa-th"></i> Residual Risk Assessment (Severity × Probability)
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Residual Severity (1–5)</label>
                    <select class="form-control" id="fieldResidualSeverity">
                        <option value="">—</option>
                        <option value="1">1 — Negligible</option>
                        <option value="2">2 — Minor</option>
                        <option value="3">3 — Major</option>
                        <option value="4">4 — Hazardous</option>
                        <option value="5">5 — Catastrophic</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Residual Probability (1–5)</label>
                    <select class="form-control" id="fieldResidualProbability">
                        <option value="">—</option>
                        <option value="1">1 — Improbable</option>
                        <option value="2">2 — Remote</option>
                        <option value="3">3 — Occasional</option>
                        <option value="4">4 — Probable</option>
                        <option value="5">5 — Frequent</option>
                    </select>
                </div>
            </div>

            <div class="risk-preview">
                Residual Risk Index: <strong id="residualRiskIndexValue">—</strong> &nbsp;·&nbsp; Level: <span id="residualRiskLevel" class="badge badge-default">—</span>
            </div>

            <div style="text-align:right;margin-top:1.5rem;">
                <button type="button" class="btn-submit" onclick="submitCap()"><i class="fas fa-paper-plane"></i> Submit CAP</button>
            </div>
        </form>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="/js/firebase.js"></script>
<script src="/js/api/client.js"></script>
<script src="/js/can_cap.js"></script>
<script>
let canId = null;

firebase.auth().onAuthStateChanged(function(user) {
    if (!user) { window.location.href = '/login.html'; return; }
    const params = new URLSearchParams(window.location.search);
    canId = params.get('can_id');
    if (!canId) { showMessage('No CAN ID provided', 'error'); return; }
    loadCanInfo(canId);
    wireResidualRisk();
});

async function loadCanInfo(id) {
    try {
        const can = await CanCapAPI.getCan(id);
        document.getElementById('canInfo').style.display = 'block';
        document.getElementById('canRefTitle').textContent = `${can.can_reference}: ${can.title}`;
        document.getElementById('canDescription').textContent = `Assigned to: ${can.assigned_to} | Target: ${formatCanDate(can.target_completion_date)}`;
    } catch (e) {
        showMessage('Error loading CAN: ' + e.message, 'error');
    }
}

function wireResidualRisk() {
    const sev = document.getElementById('fieldResidualSeverity');
    const prob = document.getElementById('fieldResidualProbability');
    const indexEl = document.getElementById('residualRiskIndexValue');
    const levelEl = document.getElementById('residualRiskLevel');

    function update() {
        const s = parseInt(sev.value, 10);
        const p = parseInt(prob.value, 10);
        if (!s || !p) {
            indexEl.textContent = '—';
            levelEl.textContent = '—';
            levelEl.className = 'badge badge-default';
            return;
        }
        const ri = s * p;
        let level = 'Low', cls = 'badge-low';
        if (ri > 15) { level = 'Very High'; cls = 'badge-critical'; }
        else if (ri > 9) { level = 'High'; cls = 'badge-high'; }
        else if (ri > 5) { level = 'Medium'; cls = 'badge-medium'; }
        indexEl.textContent = ri;
        levelEl.textContent = level;
        levelEl.className = 'badge ' + cls;
    }

    sev.addEventListener('change', update);
    prob.addEventListener('change', update);
}

async function submitCap() {
    const actionPlan = document.getElementById('fieldActionPlan').value.trim();
    const timeline = document.getElementById('fieldTimeline').value.trim();
    const targetDate = document.getElementById('fieldTargetDate').value;

    if (!actionPlan || actionPlan.length < 10) { showMessage('Action plan is required (min 10 characters)', 'error'); return; }
    if (!timeline) { showMessage('Timeline is required', 'error'); return; }
    if (!targetDate) { showMessage('Target completion date is required', 'error'); return; }

    const rSev = parseInt(document.getElementById('fieldResidualSeverity').value, 10);
    const rProb = parseInt(document.getElementById('fieldResidualProbability').value, 10);
    const residualRiskIndex = (rSev && rProb) ? rSev * rProb : null;
    let residualRiskLevel = null;
    if (residualRiskIndex) {
        if (residualRiskIndex > 15) residualRiskLevel = 'Very High';
        else if (residualRiskIndex > 9) residualRiskLevel = 'High';
        else if (residualRiskIndex > 5) residualRiskLevel = 'Medium';
        else residualRiskLevel = 'Low';
    }

    const data = {
        can_id: canId,
        action_plan: actionPlan,
        timeline: timeline,
        target_completion_date: new Date(targetDate).toISOString(),
        resources_required: document.getElementById('fieldResources').value.trim() || null,
        implementation_plan: document.getElementById('fieldImplPlan').value.trim() || null,
        rca: document.getElementById('fieldRca').value.trim() || null,
        process_owner: document.getElementById('fieldProcessOwner').value.trim() || null,
        residual_severity: rSev || null,
        residual_probability: rProb || null,
        residual_risk_index: residualRiskIndex,
        residual_risk_level: residualRiskLevel,
    };

    const btn = document.querySelector('.btn-submit');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';

    try {
        const result = await CanCapAPI.submitCap(canId, data);
        showMessage(`CAP ${result.cap_reference} submitted successfully!`, 'success');
        setTimeout(() => {
            window.location.href = `/can_cap/can_detail.html?id=${canId}`;
        }, 1500);
    } catch (err) {
        showMessage('Error: ' + err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit CAP';
    }
}

function showMessage(text, type) {
    const msg = document.getElementById('message');
    msg.textContent = text;
    msg.className = type;
    msg.style.display = 'block';
    if (type === 'error') {
        setTimeout(() => { msg.style.display = 'none'; }, 6000);
    }
}
</script>
</body>
</html>
