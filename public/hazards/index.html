<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Hazard Register - AviaSAFE</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f1f5f9; font-family: 'Inter', system-ui, -apple-system, sans-serif; color: #0b2a42; margin: 0; }
        .page { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        .nav { background: #0b2a42; color: #fff; padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .nav h1 { font-size: 1.1rem; font-weight: 600; margin: 0; }
        .nav h1 i { margin-right: 0.5rem; }
        .nav-actions { display: flex; align-items: center; gap: 1rem; }
        .nav-actions span { font-size: 0.8rem; opacity: 0.8; }
        .btn-logout { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
        .btn-logout:hover { background: rgba(255,255,255,0.1); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
        .header-bar h2 { margin: 0; color: #0b2a42; }
        .filter-bar { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; background: #fff; padding: 1rem 1.25rem; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 1.5rem; }
        .filter-bar label { font-size: 0.8rem; font-weight: 600; color: #475569; }
        .filter-bar select, .filter-bar input { padding: 0.4rem 0.75rem; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 0.85rem; background: #fff; }
        .filter-bar .btn-search { background: #1a6b8a; color: #fff; border: none; padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
        .filter-bar .btn-search:hover { background: #0b2a42; }
        .filter-bar .btn-clear { background: transparent; color: #64748b; border: 1px solid #e2e8f0; padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
        .table-card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow: hidden; }
        .table-card table { width: 100%; border-collapse: collapse; }
        .table-card th { background: #f8fafc; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; padding: 0.85rem 1rem; text-align: left; border-bottom: 2px solid #e2e8f0; }
        .table-card th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
        .table-card th.sortable:hover { color: #0b2a42; }
        .table-card th .fa-sort, .table-card th .fa-sort-up, .table-card th .fa-sort-down { margin-left: 0.3rem; opacity: 0.6; font-size: 0.7rem; }
        .table-card td { padding: 0.75rem 1rem; border-bottom: 1px solid #f1f5f9; font-size: 0.875rem; }
        .table-card tbody tr { cursor: pointer; }
        .table-card tbody tr:hover { background: #f8fafc; }
        .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
        .badge-critical { background: #fde8e8; color: #dc3545; }
        .badge-high { background: #fff3e0; color: #e65100; }
        .badge-medium { background: #fff8e1; color: #f9a825; }
        .badge-low { background: #e8f5e9; color: #2e7d32; }
        .badge-default { background: #f1f5f9; color: #64748b; }
        .badge-new { background: #e3f2fd; color: #1565c0; }
        .badge-processing { background: #fff3e0; color: #e65100; }
        .badge-warning { background: #fef3c7; color: #d97706; }
        .badge-completed { background: #e8f5e9; color: #2e7d32; }
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-card { background: #fff; padding: 1rem; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); text-align: center; }
        .stat-card .num { font-size: 1.5rem; font-weight: 700; color: #0b2a42; }
        .stat-card .lbl { font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.3px; margin-top: 0.25rem; }
        .loading-state { display: flex; align-items: center; justify-content: center; padding: 3rem; color: #64748b; }
        .loading-state i { font-size: 1.5rem; margin-right: 0.5rem; }
        .empty-state { text-align: center; padding: 3rem; color: #64748b; }
        .pagination { display: flex; align-items: center; justify-content: center; gap: 1rem; padding: 1rem; }
        .page-btn { background: #fff; border: 1px solid #e2e8f0; padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: all 0.15s; }
        .page-btn:hover:not(:disabled) { background: #f1f5f9; border-color: #1a6b8a; color: #1a6b8a; }
        .page-btn:disabled { opacity: 0.4; cursor: default; }
        .page-info { font-size: 0.85rem; color: #64748b; }
        @media (max-width: 768px) {
            .filter-bar { flex-direction: column; align-items: stretch; }
            .header-bar { flex-direction: column; align-items: stretch; }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/theme.css">
    <script src="../js/theme-toggle.js"></script>
    </head>
<body>

<nav class="nav">
    <h1><i class="fas fa-exclamation-triangle"></i> Master Hazard Register</h1>
    <div class="nav-actions">
        <span id="userDisplay"></span>
        <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
</nav>

<div class="page">
    <div class="header-bar">
        <h2><i class="fas fa-list"></i> Master Hazard Register</h2>
        <div>
            <a href="/safety.html" class="btn btn-outline btn-sm"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
            <a href="/can_cap/cans.html" class="btn btn-outline btn-sm"><i class="fas fa-clipboard-check"></i> View All CANs</a>
            <a href="/hazards/create.html" class="btn btn-primary btn-sm"><i class="fas fa-plus"></i> New Hazard</a>
        </div>
    </div>

    <div id="statsRow" class="stats-row"></div>

    <div class="filter-bar">
        <label>Status:</label>
        <select id="filterStatus"><option value="">All</option></select>
        <label>Priority:</label>
        <select id="filterPriority"><option value="">All</option></select>
        <label>Source:</label>
        <select id="filterSource"><option value="">All</option></select>
        <label>Taxonomy:</label>
        <select id="filterTaxonomy"><option value="">All</option></select>
        <label>Date:</label>
        <select id="filterDateField">
            <option value="created_at">Created</option>
            <option value="updated_at">Updated</option>
        </select>
        <input type="date" id="filterDateFrom" title="From date">
        <input type="date" id="filterDateTo" title="To date">
        <input type="text" id="filterSearch" placeholder="Search hazard ID, title..." style="flex:1;min-width:150px;">
        <button class="btn-search" onclick="loadHazards()"><i class="fas fa-search"></i> Search</button>
        <button class="btn-clear" onclick="clearFilters()"><i class="fas fa-times"></i> Clear</button>
    </div>

    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th class="sortable" data-sort="hazard_id">Hazard ID <i class="fas fa-sort"></i></th>
                    <th class="sortable" data-sort="title">Title <i class="fas fa-sort"></i></th>
                    <th class="sortable" data-sort="source">Source <i class="fas fa-sort"></i></th>
                    <th class="sortable" data-sort="taxonomy">Taxonomy <i class="fas fa-sort"></i></th>
                    <th class="sortable" data-sort="priority">Priority <i class="fas fa-sort"></i></th>
                    <th class="sortable" data-sort="risk_level">Risk Level <i class="fas fa-sort"></i></th>
                    <th class="sortable" data-sort="status">Status <i class="fas fa-sort"></i></th>
                    <th class="sortable" data-sort="assigned_to">Assigned To <i class="fas fa-sort"></i></th>
                    <th class="sortable" data-sort="created_at">Created <i class="fas fa-sort"></i></th>
                </tr>
            </thead>
            <tbody id="hazardsBody"></tbody>
        </table>
        <div id="loadingIndicator" class="loading-state" style="display:none;">
            <i class="fas fa-spinner fa-spin"></i> Loading hazards...
        </div>
        <div id="emptyIndicator" class="empty-state" style="display:none;">
            <i class="fas fa-inbox" style="font-size:2rem;margin-bottom:0.5rem;"></i>
            <p>No hazards found.</p>
        </div>
        <div id="pagination" class="pagination" style="display:none;"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="/js/firebase.js"></script>
<script src="/js/api/client.js"></script>
<script src="/js/hazards.js"></script>
<script>
let currentUser = null;
let allHazards = [];
let sortKey = 'created_at';
let sortDir = -1;
const PAGE_SIZE = 10;
let currentPage = 1;

firebase.auth().onAuthStateChanged(function(user) {
    if (!user) { window.location.href = '/login.html'; return; }
    currentUser = user;
    document.getElementById('userDisplay').textContent = user.email;
    populateFilters();
    initSortableHeaders();
    loadHazards();
    loadStats();
});

function populateFilters() {
    const statusSel = document.getElementById('filterStatus');
    HAZARD_STATUSES.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        statusSel.appendChild(opt);
    });
    const prioritySel = document.getElementById('filterPriority');
    HAZARD_PRIORITIES.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p; opt.textContent = p;
        prioritySel.appendChild(opt);
    });
    const sourceSel = document.getElementById('filterSource');
    HAZARD_SOURCES.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        sourceSel.appendChild(opt);
    });
    const taxSel = document.getElementById('filterTaxonomy');
    HAZARD_TAXONOMIES.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t; opt.textContent = t;
        taxSel.appendChild(opt);
    });
}

function getFilters() {
    return {
        status: document.getElementById('filterStatus').value,
        priority: document.getElementById('filterPriority').value,
        source: document.getElementById('filterSource').value,
        taxonomy: document.getElementById('filterTaxonomy').value,
        search: document.getElementById('filterSearch').value,
        dateField: document.getElementById('filterDateField').value,
        dateFrom: document.getElementById('filterDateFrom').value,
        dateTo: document.getElementById('filterDateTo').value,
    };
}

function clearFilters() {
    document.getElementById('filterStatus').value = '';
    document.getElementById('filterPriority').value = '';
    document.getElementById('filterSource').value = '';
    document.getElementById('filterTaxonomy').value = '';
    document.getElementById('filterSearch').value = '';
    document.getElementById('filterDateField').value = 'created_at';
    document.getElementById('filterDateFrom').value = '';
    document.getElementById('filterDateTo').value = '';
    loadHazards();
}

async function loadHazards() {
    const tbody = document.getElementById('hazardsBody');
    const loading = document.getElementById('loadingIndicator');
    const empty = document.getElementById('emptyIndicator');
    tbody.innerHTML = '';
    loading.style.display = 'flex';
    empty.style.display = 'none';

    try {
        const data = await HazardsAPI.list(getFilters());
        loading.style.display = 'none';
        allHazards = Array.isArray(data) ? data : [];
        currentPage = 1;
        renderTable();
    } catch (err) {
        loading.style.display = 'none';
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;color:#dc3545;padding:2rem;"><i class="fas fa-exclamation-circle"></i> Error: ${err.message}</td></tr>`;
    }
}

function applyDateFilter(rows) {
    const f = getFilters();
    const field = f.dateField || 'created_at';
    const from = f.dateFrom ? new Date(f.dateFrom + 'T00:00:00') : null;
    const to = f.dateTo ? new Date(f.dateTo + 'T23:59:59.999') : null;
    if (!from && !to) return rows;
    return rows.filter(function(r) {
        const d = r[field] ? new Date(r[field]) : null;
        if (!d) return true;
        if (from && d < from) return false;
        if (to && d > to) return false;
        return true;
    });
}

function sortRows(rows) {
    const dir = sortDir;
    const key = sortKey;
    return rows.slice().sort(function(a, b) {
        let va = a[key];
        let vb = b[key];
        if (key === 'created_at' || key === 'updated_at') {
            va = va ? new Date(va).getTime() : 0;
            vb = vb ? new Date(vb).getTime() : 0;
        } else {
            va = (va == null ? '' : String(va)).toLowerCase();
            vb = (vb == null ? '' : String(vb)).toLowerCase();
        }
        if (va < vb) return -1 * dir;
        if (va > vb) return 1 * dir;
        return 0;
    });
}

function renderTable() {
    const tbody = document.getElementById('hazardsBody');
    const empty = document.getElementById('emptyIndicator');
    const rows = sortRows(applyDateFilter(allHazards));
    tbody.innerHTML = '';
    if (rows.length === 0) {
        empty.style.display = 'block';
        renderPagination(0);
        return;
    }
    empty.style.display = 'none';
    const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;
    const start = (currentPage - 1) * PAGE_SIZE;
    const pageRows = rows.slice(start, start + PAGE_SIZE);
    pageRows.forEach(function(h) {
        const tr = document.createElement('tr');
        tr.style.cursor = 'pointer';
        tr.addEventListener('click', function() {
            window.location.href = `/hazards/detail.html?id=${h.id}`;
        });
        const riskClass = hazardRiskBadgeClass(h.risk_level);
        const statusClass = hazardStatusBadgeClass(h.status);
        const priorityClass = hazardPriorityBadgeClass(h.priority);
        tr.innerHTML = `
            <td><strong>${h.hazard_id || h.id}</strong></td>
            <td>${h.title}</td>
            <td>${h.source || '-'}</td>
            <td>${h.taxonomy || '-'}</td>
            <td><span class="badge ${priorityClass}">${h.priority}</span></td>
            <td><span class="badge ${riskClass}">${h.risk_level || 'N/A'}</span></td>
            <td><span class="badge ${statusClass}">${h.status}</span></td>
            <td>${h.assigned_to || '-'}</td>
            <td>${formatDate(h.created_at)}</td>
        `;
        tbody.appendChild(tr);
    });
    renderPagination(rows.length);
}

function renderPagination(total) {
    const container = document.getElementById('pagination');
    if (!container) return;
    if (total <= PAGE_SIZE) {
        container.style.display = 'none';
        return;
    }
    container.style.display = 'flex';
    const totalPages = Math.ceil(total / PAGE_SIZE);
    const start = (currentPage - 1) * PAGE_SIZE + 1;
    const end = Math.min(currentPage * PAGE_SIZE, total);
    container.innerHTML = `
        <button class="page-btn" id="pagePrev" ${currentPage === 1 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i> Previous</button>
        <span class="page-info">Showing ${start}–${end} of ${total} · Page ${currentPage} of ${totalPages}</span>
        <button class="page-btn" id="pageNext" ${currentPage === totalPages ? 'disabled' : ''}>Next <i class="fas fa-chevron-right"></i></button>
    `;
    document.getElementById('pagePrev').addEventListener('click', function() {
        currentPage--;
        renderTable();
    });
    document.getElementById('pageNext').addEventListener('click', function() {
        currentPage++;
        renderTable();
    });
}

function initSortableHeaders() {
    document.querySelectorAll('th.sortable').forEach(function(th) {
        th.addEventListener('click', function() {
            const key = th.dataset.sort;
            if (sortKey === key) {
                sortDir = -sortDir;
            } else {
                sortKey = key;
                sortDir = (key === 'created_at' || key === 'updated_at') ? -1 : 1;
            }
            updateSortIndicators();
            renderTable();
        });
    });
}

function updateSortIndicators() {
    document.querySelectorAll('th.sortable').forEach(function(th) {
        const icon = th.querySelector('i');
        if (!icon) return;
        if (th.dataset.sort === sortKey) {
            icon.className = sortDir === 1 ? 'fas fa-sort-up' : 'fas fa-sort-down';
        } else {
            icon.className = 'fas fa-sort';
        }
    });
}

const HAZARD_STATUS_CARD_ORDER = ['Open', 'Processing', 'Under Review', 'Closed', 'Reopened'];

async function loadStats() {
    try {
        const stats = await HazardsAPI.getStats();
        const container = document.getElementById('statsRow');
        const statuses = stats.by_status || {};
        container.innerHTML = HAZARD_STATUS_CARD_ORDER.map((status) =>
            `<div class="stat-card"><div class="num">${statuses[status] || 0}</div><div class="lbl">${status.toUpperCase()}</div></div>`
        ).join('') +
            `<div class="stat-card"><div class="num">${stats.total || 0}</div><div class="lbl">Total Hazards</div></div>`;
    } catch (e) {
        console.error('Stats error:', e);
    }
}

async function logout() {
    try { await firebase.auth().signOut(); window.location.href = '/'; }
    catch (e) { console.error(e); }
}
</script>
</body>
</html>
