<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks - AviaSAFE</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f1f5f9; font-family: 'Inter', system-ui, -apple-system, sans-serif; color: #0b2a42; margin: 0; }
        .page { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        .nav { background: #0b2a42; color: #fff; padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .nav h1 { font-size: 1.1rem; font-weight: 600; margin: 0; }
        .nav h1 i { margin-right: 0.5rem; }
        .nav-actions { display: flex; align-items: center; gap: 1rem; }
        .nav-actions span { font-size: 0.8rem; opacity: 0.8; }
        .btn-logout { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
        .btn-logout:hover { background: rgba(255,255,255,0.1); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
        .header-bar h2 { margin: 0; color: #0b2a42; }
        .filter-bar { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; background: #fff; padding: 1rem 1.25rem; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 1.5rem; }
        .filter-bar label { font-size: 0.8rem; font-weight: 600; color: #475569; }
        .filter-bar select, .filter-bar input { padding: 0.4rem 0.75rem; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 0.85rem; background: #fff; }
        .filter-bar .btn-search { background: #1a6b8a; color: #fff; border: none; padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
        .table-card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow: hidden; }
        .table-card table { width: 100%; border-collapse: collapse; }
        .table-card th { background: #f8fafc; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; padding: 0.85rem 1rem; text-align: left; border-bottom: 2px solid #e2e8f0; }
        .table-card td { padding: 0.75rem 1rem; border-bottom: 1px solid #f1f5f9; font-size: 0.875rem; }
        .table-card tbody tr { cursor: pointer; }
        .table-card tbody tr:hover { background: #f8fafc; }
        .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
        .badge-critical { background: #fde8e8; color: #dc3545; }
        .badge-high { background: #fff3e0; color: #e65100; }
        .badge-medium { background: #fff8e1; color: #f9a825; }
        .badge-low { background: #e8f5e9; color: #2e7d32; }
        .badge-default { background: #f1f5f9; color: #64748b; }
        .badge-new { background: #e3f2fd; color: #1565c0; }
        .badge-processing { background: #fff3e0; color: #e65100; }
        .badge-warning { background: #fef3c7; color: #d97706; }
        .badge-completed { background: #e8f5e9; color: #2e7d32; }
        .badge-danger { background: #fde8e8; color: #b91c1c; }
        .badge-type-hazard { background: #e3f2fd; color: #1565c0; }
        .badge-type-can { background: #ede7f6; color: #5e35b1; }
        .badge-type-cap { background: #fce4ec; color: #c2185b; }
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-card { background: #fff; padding: 1rem; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); text-align: center; }
        .stat-card .num { font-size: 1.5rem; font-weight: 700; color: #0b2a42; }
        .stat-card .lbl { font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.3px; margin-top: 0.25rem; }
        .stat-card.red { border-top: 3px solid #dc3545; }
        .stat-card.red .num { color: #dc3545; }
        .loading-state { display: flex; align-items: center; justify-content: center; padding: 3rem; color: #64748b; }
        .loading-state i { font-size: 1.5rem; margin-right: 0.5rem; }
        .empty-state { text-align: center; padding: 3rem; color: #64748b; }
        .info-banner { background: #e3f2fd; color: #1565c0; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.5rem; font-size: 0.9rem; display: flex; align-items: center; gap: 0.75rem; }
        @media (max-width: 768px) { .filter-bar { flex-direction: column; align-items: stretch; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<nav class="nav">
    <h1><i class="fas fa-user-tie"></i> My Tasks</h1>
    <div class="nav-actions">
        <span id="userDisplay"></span>
        <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
</nav>

<!-- Uniform top section: tenant name + department label -->
<section class="dash-hero">
    <h1 id="dashHeroTitle">My Tasks</h1>
    <div class="dash-hero-user" id="dashHeroUser">—</div>
</section>

<div class="page">
    <div class="header-bar">
        <h2><i class="fas fa-list-check"></i> Assigned CANs & CAPs</h2>
        <div>
            <a href="/safety.html" class="btn btn-outline btn-sm"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
            <a href="/dashboard/master-register.html" class="btn btn-outline btn-sm"><i class="fas fa-table"></i> Master Register</a>
        </div>
    </div>

    <div id="infoBanner" class="info-banner" style="display:none;">
        <i class="fas fa-circle-info"></i>
        <span>Showing items assigned to <strong id="assigneeLabel">you</strong> in your department.</span>
    </div>

    <div id="statsRow" class="stats-row"></div>

    <div class="filter-bar">
        <label>Status:</label>
        <select id="filterStatus"><option value="">All</option></select>
        <label>Type:</label>
        <select id="filterType">
            <option value="">All</option>
            <option value="CAN">CAN</option>
            <option value="CAP">CAP</option>
        </select>
        <button class="btn-search" onclick="loadTasks()"><i class="fas fa-search"></i> Apply</button>
    </div>

    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th>Reference</th>
                    <th>Title</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th>Priority</th>
                    <th>Target Date</th>
                </tr>
            </thead>
            <tbody id="tasksBody"></tbody>
        </table>
        <div id="loadingIndicator" class="loading-state" style="display:none;">
            <i class="fas fa-spinner fa-spin"></i> Loading tasks...
        </div>
        <div id="emptyIndicator" class="empty-state" style="display:none;">
            <i class="fas fa-inbox" style="font-size:2rem;margin-bottom:0.5rem;"></i>
            <p>No tasks assigned to you.</p>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="/js/firebase.js"></script>
<script src="/js/api/client.js"></script>
<script>
let currentUser = null;
let allRows = [];
let myUid = null;

firebase.auth().onAuthStateChanged(async function(user) {
    if (!user) { window.location.href = '/login.html'; return; }
    currentUser = user;
    document.getElementById('userDisplay').textContent = user.email;
    const heroTitle = document.getElementById('dashHeroTitle');
    const heroUser = document.getElementById('dashHeroUser');
    try {
        const tokenResult = await user.getIdTokenResult();
        myUid = user.uid;
        if (heroTitle) {
            const t = (tokenResult.claims && tokenResult.claims.tenant_id) || '';
            if (t) heroTitle.textContent = t.replace(/-/g, ' ').toUpperCase();
        }
        if (heroUser && typeof getDepartmentLabel === 'function') {
            heroUser.textContent = getDepartmentLabel(tokenResult.claims) || '—';
        }
        const department = (tokenResult.claims && tokenResult.claims.department) || '';
        if (department) {
            document.getElementById('infoBanner').style.display = 'flex';
            document.getElementById('assigneeLabel').textContent = 'you (' + department + ')';
        }
    } catch (e) {
        myUid = user.uid;
    }
    loadTasks();
});

function formatDate(iso) {
    if (!iso) return '-';
    try { return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }); }
    catch (e) { return iso; }
}

function typeBadgeClass(type) {
    return type === 'CAN' ? 'badge-type-can' : 'badge-type-cap';
}

function statusBadgeClass(status) {
    const map = {
        'Open': 'badge-new',
        'Under Review': 'badge-warning',
        'Closed': 'badge-completed',
        'In Progress': 'badge-processing',
        'Completed': 'badge-completed',
        'Revision Required': 'badge-critical',
        'Overdue': 'badge-danger',
        'Escalated': 'badge-danger',
    };
    return map[status] || 'badge-default';
}

function priorityBadgeClass(priority) {
    const map = { 'High': 'badge-high', 'Medium': 'badge-medium', 'Low': 'badge-low' };
    return map[priority] || 'badge-default';
}

async function loadTasks() {
    const tbody = document.getElementById('tasksBody');
    const loading = document.getElementById('loadingIndicator');
    const empty = document.getElementById('emptyIndicator');
    const statusSel = document.getElementById('filterStatus');
    tbody.innerHTML = '';
    loading.style.display = 'flex';
    empty.style.display = 'none';

    try {
        const params = new URLSearchParams();
        if (myUid) params.set('assigned_to_uid', myUid);
        const qs = params.toString() ? '?' + params.toString() : '';
        const payload = await ApiClient.get('/api/v1/dashboard/master-register' + qs);
        const data = payload || {};
        allRows = (data.rows || []).filter(function(r) {
            return r.type === 'CAN' || r.type === 'CAP';
        });

        const current = statusSel.value;
        statusSel.innerHTML = '<option value="">All</option>';
        Object.keys(data.by_status || {}).sort().forEach(function(s) {
            const opt = document.createElement('option');
            opt.value = s; opt.textContent = s;
            statusSel.appendChild(opt);
        });
        statusSel.value = current;

        renderStats(allRows);
        renderTable();
        loading.style.display = 'none';
    } catch (err) {
        loading.style.display = 'none';
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#dc3545;padding:2rem;"><i class="fas fa-exclamation-circle"></i> Error: ${err.message}</td></tr>`;
    }
}

function renderStats(rows) {
    const container = document.getElementById('statsRow');
    const byStatus = {};
    rows.forEach(function(r) { byStatus[r.status] = (byStatus[r.status] || 0) + 1; });
    const overdue = (byStatus['Overdue'] || 0) + (byStatus['Escalated'] || 0);
    let html = '<div class="stat-card"><div class="num">' + rows.length + '</div><div class="lbl">Total Tasks</div></div>';
    Object.keys(byStatus).sort().forEach(function(s) {
        html += '<div class="stat-card"><div class="num">' + byStatus[s] + '</div><div class="lbl">' + s + '</div></div>';
    });
    html += '<div class="stat-card red"><div class="num">' + overdue + '</div><div class="lbl">Overdue / Escalated</div></div>';
    container.innerHTML = html;
}

function renderTable() {
    const tbody = document.getElementById('tasksBody');
    const empty = document.getElementById('emptyIndicator');
    let rows = allRows;
    const statusFilter = document.getElementById('filterStatus').value;
    if (statusFilter) rows = rows.filter(function(r) { return r.status === statusFilter; });
    const typeFilter = document.getElementById('filterType').value;
    if (typeFilter) rows = rows.filter(function(r) { return r.type === typeFilter; });

    tbody.innerHTML = '';
    if (rows.length === 0) {
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';
    rows.forEach(function(r) {
        const tr = document.createElement('tr');
        tr.style.cursor = 'pointer';
        tr.addEventListener('click', function() {
            window.location.href = r.detail_url;
        });
        tr.innerHTML = `
            <td><strong>${r.reference}</strong></td>
            <td>${r.title}</td>
            <td><span class="badge ${typeBadgeClass(r.type)}">${r.type}</span></td>
            <td><span class="badge ${statusBadgeClass(r.status)}">${r.status}</span></td>
            <td><span class="badge ${priorityBadgeClass(r.priority)}">${r.priority || '-'}</span></td>
            <td>${formatDate(r.target_date)}</td>
        `;
        tbody.appendChild(tr);
    });
}

async function logout() {
    try { await firebase.auth().signOut(); window.location.href = '/'; }
    catch (e) { console.error(e); }
}
</script>

<!-- ========== FOOTER ========== -->
<footer class="dashboard-footer text-center py-3">
  <p class="mb-0 text-muted" style="font-size: 0.875rem;">A project by <strong>Ghanshyam Acharya</strong>.</p>
</footer>

</body>
</html>
