<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device=device, initial-scale=1.0">
    <title>AviaSAFE Safety Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="dashboard">
        <header class="dashboard-header">
            <h1>AviaSAFE Safety Dashboard</h1>
            <div class="user-info">
                <span id="user-name"></span>
                <button id="logout-btn">Logout</button>
            </div>
        </header>
        
        <main class="dashboard-main">
            <div class="kpi-cards">
                <div class="kpi-card">
                    <h3>TOTAL REPORTS</h3>
                    <div id="total-reports">0</div>
                </div>
                <div class="kpi-card">
                    <h3>OPEN CASES</h3>
                    <div id="open-cases">0</div>
                </div>
                <div class="kpi-card">
                    <h3>ACTIVE HAZARDS</h3>
                    <div id="active-hazards">0</div>
                </div>
            </div>
            
            <div class="hazard-list">
                <h3>Recent Hazards</h3>
                <ul id="hazard-list"></ul>
            </div>
        </main>
    </div>
    
    <!-- Firebase SDK -->
    <script src="/js/firebase.js?v=2.1.0"></script>
    <script src="/js/app.js"></script>
</body>
</html>
