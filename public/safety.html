<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Safety Dashboard — AviaSAFE SMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase.js?v=2.1.1"></script>
</head>
<body class="bg-slate-100">
  <div class="max-w-7xl mx-auto p-4">
    <!-- Header -->
    <header class="bg-white shadow-md border border-slate-200 rounded-t-2xl p-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold text-slate-900">AviaSAFE Safety Dashboard</h1>
          <p class="text-sm text-slate-500">Safety Data to Safety Intelligence</p>
        </div>
        <div class="flex items-center gap-4">
          <span id="user-name" class="text-sm text-slate-500"></span>
          <button id="logout-btn" class="text-sm text-sky-600 hover:underline">Logout</button>
        </div>
      </div>
    </header>

    <main class="p-4">
      <!-- KPI Cards Grid -->
      <div class="grid grid-cols-2 gap-4 mb-6">
        <!-- Total Reports Card -->
        <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
          <div class="flex items-baseline">
            <div class="text-3xl font-bold text-slate-900" id="total-reports">0</div>
            <div class="text-sm text-slate-500 ml-2">Total Reports</div>
          </div>
        </div>

        <!-- Open Cases Card -->
        <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
          <div class="flex items-baseline">
            <div class="text-3xl font-bold text-slate-900" id="open-cases">0</div>
            <div class="text-sm text-slate-500 ml-2">Open Cases</div>
          </div>
        </div>

        <!-- Active Hazards Card -->
        <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
          <div class="flex items-baseline">
            <div class="text-3xl font-bold text-slate-900" id="active-hazards">0</div>
            <div class="text-sm text-slate-500 ml-2">Active Hazards</div>
          </div>
        </div>
      </div>

      <!-- Recent Hazards -->
      <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
        <h3 class="text-sm font-medium text-slate-600 mb-4">Recent Hazards</h3>
        <ul id="hazard-list" class="space-y-2">
          <!-- Hazard items injected by JavaScript -->
        </ul>
      </div>
    </main>
  </div>

  <!-- Firebase SDK -->
  <script src="/js/firebase.js?v=2.1.1"></script>
  <script src="/js/app.js"></script>
</body>
</html>
