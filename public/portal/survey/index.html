<!--
  FOLDER/FILE PATH: public/portal/survey/index.html
  VERSION NO: 3.1.1
  DATE: 2026-08-07
  PURPOSE OF THE FILE: Legacy path redirect. The functional bilingual survey was
  consolidated to /survey/ (public/survey/). This page forwards any remaining
  /portal/survey/ links (with their ?tenant= parameter) to the canonical survey.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting — Safety Culture Survey</title>
    <meta http-equiv="refresh" content="0; url=/survey/">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/theme.css">
    <script src="../../js/theme-toggle.js"></script>
    </head>
<body>
    <script>
        var params = new URLSearchParams(window.location.search);
        var target = '/survey/';
        if (params.get('tenant')) target += '?tenant=' + encodeURIComponent(params.get('tenant'));
        window.location.replace(target);
    </script>
    <p>Redirecting to <a href="/survey/">the safety culture survey</a>...</p>
</body>
</html>
