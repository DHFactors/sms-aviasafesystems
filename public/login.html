<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AviaSAFE SMS — Aviation Safety Management & State Oversight Platform</title>
    <meta name="description" content="AviaSAFE SMS is an aviation safety management and state oversight platform engineered for ICAO Annex 19 (3rd Edition), Doc 9859 and Doc 10159 compliance — turning safety data into safety intelligence.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="AviaSAFESMS — From Safety Data to Safety Intelligence">
    <meta property="og:description" content="One connected safety intelligence ecosystem for airlines, operators and regulators — ICAO Annex 19, Doc 10159 aligned.">
    <meta property="og:url" content="https://betasms.aviasafesystems.com/">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        deepTeal: {
                            900: '#072535',
                            800: '#0A3A50',
                            700: '#0E4E6C',
                            600: '#12648A',
                        },
                        brand: {
                            50: '#F0F9FF',
                            100: '#E0F2FE',
                            300: '#7DD3FC',
                            400: '#38BDF8',
                            500: '#0284C7',
                            600: '#0284C7',
                            700: '#0369A1',
                            800: '#075985',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }

        /* Fixed-header anchor offset: keep every section id clear of the 80px
           sticky nav so #why-it-matters / #capabilities / #ecosystem / #onboarding
           land correctly. */
        section[id] { scroll-margin-top: 96px; }

        /* Auto-Scrolling Gallery */
        @keyframes scrollGallery {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }
        .animated-gallery {
            animation: scrollGallery 28s linear infinite;
        }
        .animated-gallery:hover {
            animation-play-state: paused;
        }

        /* Light Card Hover Effects */
        .light-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -2px rgba(0, 0, 0, 0.03);
            transition: all 0.25s ease-in-out;
        }
        .light-card:hover {
            border-color: #0284C7;
            box-shadow: 0 12px 24px -8px rgba(2, 132, 199, 0.15);
        }
    </style>

    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="/css/copilot-widget.css">
</head>
<body>
    <div class="login-container">
        <h2>AviaSAFE SMS — Login</h2>
        <p class="subtitle">Enter your credentials to access the safety dashboard</p>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" id="login-btn" class="btn-primary">Sign In</button>
        </form>
        <p class="switch-text">
            Not an organization yet? 
            <a href="https://sms-aviasafesystems-beta.web.app/login.html" class="text-blue-600 hover:underline">
                Demo / Beta Sandbox (Buddha Air & 19 operator datasets)
            </a>
        </p>
    </div>
    
    <!-- Firebase SDK -->
    <script src="/js/firebase.js?v=2.1.0"></script>
    <script src="/js/app.js"></script>
</body>
</html>
