<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — AviaSAFE SMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase.js?v=2.1.1"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
    <!-- Header / Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-sky-50 text-sky-600 rounded-xl mb-3">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight">AviaSAFE</h1>
      <p class="text-xs text-slate-500 font-medium uppercase tracking-wider mt-1">Safety Data to Safety Intelligence</p>
    </div>

    <!-- Error Alert Box -->
    <div id="loginError" class="hidden mb-5 p-3 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-sm"></div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1" for="email">Email Address</label>
        <input id="email" type="email" required placeholder="safety@buddha-air.com"
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 bg-slate-50 text-slate-900 text-sm focus:ring-2 focus:ring-sky-500 focus:border-sky-500 focus:bg-white transition" />
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1" for="password">Password</label>
        <input id="password" type="password" required placeholder="••••••••••••"
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 bg-slate-50 text-slate-900 text-sm focus:ring-2 focus:ring-sky-500 focus:border-sky-500 focus:bg-white transition" />
      </div>

      <button type="submit" id="submitBtn"
        class="w-full py-3 px-4 bg-[#0e5a77] hover:bg-[#0b4860] text-white font-medium rounded-lg shadow transition flex items-center justify-center gap-2 mt-2">
        <span>Sign In</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </button>
    </form>

    <!-- Sandbox / Demo Callout -->
    <div class="mt-6 pt-5 border-t border-slate-200 text-center">
      <p class="text-xs text-slate-600">
        Demo & Testing? 
        <a href="https://sms-aviasafesystems-beta.web.app/login.html" class="text-sky-600 font-semibold hover:underline">
          Switch to Beta Sandbox
        </a>
      </p>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("loginForm");
      const errBox = document.getElementById("loginError");
      const submitBtn = document.getElementById("submitBtn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errBox.classList.add("hidden");
        submitBtn.disabled = true;
        submitBtn.classList.add("opacity-75");

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        try {
          if (!window.auth && typeof firebase !== "undefined") {
            window.auth = firebase.auth();
          }
          await window.auth.signInWithEmailAndPassword(email, password);
          window.location.href = "/safety.html";
        } catch (err) {
          console.error("Authentication error:", err);
          errBox.textContent = err.message || "Failed to sign in. Please check your credentials.";
          errBox.classList.remove("hidden");
          submitBtn.disabled = false;
          submitBtn.classList.remove("opacity-75");
        }
      });
    });
  </script>
</body>
</html>
