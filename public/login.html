<!-- ===== LOGIN LOGIC ===== -->
<script>
// ============================================================================
// WAIT FOR FIREBASE SDK
// ============================================================================

function waitForFirebase() {
    return new Promise(function(resolve) {
        if (typeof firebase !== 'undefined' && firebase.auth) {
            resolve();
            return;
        }
        var check = setInterval(function() {
            if (typeof firebase !== 'undefined' && firebase.auth) {
                clearInterval(check);
                resolve();
            }
        }, 30);
        setTimeout(function() {
            clearInterval(check);
            resolve();
        }, 10000);
    });
}

// ============================================================================
// SIGN IN FUNCTION — server-side credential verification + session restore
// ============================================================================

function getApiBaseUrl() {
    if (window.APP_CONFIG && window.APP_CONFIG.apiBaseUrl) return window.APP_CONFIG.apiBaseUrl;
    var host = window.location.hostname;
    var isBeta = host.indexOf('beta') !== -1 ||
        host === 'localhost' || host === '127.0.0.1';
    return isBeta
        ? 'https://sms-aviasafesystems-beta.onrender.com'
        : 'https://aviasafe-unified-platform.onrender.com';
}

// Attach a fresh App Check token when available (best-effort).
async function getAppCheckHeader() {
    try {
        if (typeof window.getAppCheckToken === 'function') {
            var token = await window.getAppCheckToken();
            if (token) return { 'X-Firebase-AppCheck': token };
        }
    } catch (e) { /* best-effort */ }
    return {};
}

// Credentials are verified server-side (POST /api/v1/auth/login) which enforces
// a strict per-IP failed-attempt sliding window (5 / 15 min). On success the
// backend returns a one-time custom token we exchange through the Firebase SDK,
// so the existing onAuthStateChanged session flow (fresh claims, role-based
// redirect) continues to work unchanged.
async function signIn(email, password) {
    var resp = await fetch(getApiBaseUrl() + '/api/v1/auth/login', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, await getAppCheckHeader()),
        body: JSON.stringify({ email: email, password: password })
    });
    var data = await resp.json().catch(function () { return {}; });

    if (!resp.ok) {
        if (resp.status === 429) {
            var rateErr = new Error(
                (data && (data.detail || data.message)) ||
                'Too many login attempts from this network. Please wait a few minutes and try again.'
            );
            rateErr.code = 'rate_limited';
            throw rateErr;
        }
        var credErr = new Error(
            (data && data.detail) || 'Invalid email or password. Please try again.'
        );
        credErr.code = 'invalid_credentials';
        throw credErr;
    }

    await waitForFirebase();
    await firebase.auth().signInWithCustomToken(data.custom_token);
    var user = await getCurrentUser();
    return user;
}

// ============================================================================
// TENANT RESOLUTION
// ============================================================================

function getTenantFromSubdomain() {
    if (typeof TenantResolver !== 'undefined' && TenantResolver.getTenantFromSubdomain) {
        return TenantResolver.getTenantFromSubdomain();
    }
    var hostname = window.location.hostname;
    var parts = hostname.split('.');
    
    if (parts.length >= 2 && parts[1] === 'aviasafesystems') {
        var subdomain = parts[0];
        var reserved = ['www', 'app', 'api', 'caan', 'admin', 'auth', 'docs', 'sms', 'demo', 'betasms', 'sms-beta', 'gap-analysis-ssp', 'localhost'];
        if (reserved.indexOf(subdomain) === -1) {
            return subdomain;
        }
    }
    return null;
}

// ============================================================================
// DEMO PERSONA SELECTOR — beta/demo hosts only; hidden on production subdomains
// ============================================================================

function renderDemoPersonaSelector() {
    var section = document.getElementById('demoPersonaSection');
    var select = document.getElementById('demoPersonaSelect');
    if (!section || !select) return;

    var isDemo = (typeof TenantResolver !== 'undefined') && TenantResolver.isDemoEnvironment();
    if (!isDemo) {
        // Production tenant subdomains are strictly scoped — never show switching.
        section.style.display = 'none';
        return;
    }

    section.style.display = 'block';
    var personas = (TenantResolver.DEMO_PERSONAS || []);
    select.innerHTML = '<option value="">— Select a demo persona —</option>' +
        personas.map(function (p) {
            return '<option value="' + p.tenant + '">' + p.label + '</option>';
        }).join('');

    var current = TenantResolver.getCurrentTenant();
    var active = personas.filter(function (p) { return p.tenant === current; })[0];
    if (active) select.value = active.tenant;
}

var developerPersonaActive = false;

function onDemoPersonaChange(value) {
    if (!value) return;

    // Developer / Super-Admin persona: cross-tenant, no tenant scoping. Autofill
    // the developer credentials so sign-in targets Firebase Auth directly and the
    // role-based router sends SUPER_ADMIN to the admin panel.
    if (value === 'developer') {
        developerPersonaActive = true;
        if (typeof TenantResolver !== 'undefined' && TenantResolver.clearDemoTenant) {
            TenantResolver.clearDemoTenant();
        }
        var emailInput = document.getElementById('email');
        var passwordInput = document.getElementById('password');
        if (emailInput) emailInput.value = 'ezondiza.dhf@gmail.com';
        if (passwordInput) passwordInput.value = 'DEV-Aviasafe-2026';
        updateTenantDisplay();
        return;
    }

    // CAAN SMD persona: scope to the regulator tenant and autofill the State
    // Safety Management Department account. Role-based routing lands on the
    // State Aviation Safety Oversight dashboard (/caan.html).
    if (value === 'smd') {
        developerPersonaActive = false;
        if (typeof TenantResolver !== 'undefined' && TenantResolver.setDemoTenant) {
            TenantResolver.setDemoTenant('caan');
        }
        var smdEmail = document.getElementById('email');
        var smdPassword = document.getElementById('password');
        if (smdEmail) smdEmail.value = 'smd@caanepal.gov.np';
        if (smdPassword) smdPassword.value = 'CAAN-Safety-2026';
        updateTenantDisplay();
        return;
    }

    developerPersonaActive = false;
    if (typeof TenantResolver !== 'undefined' && TenantResolver.setDemoTenant) {
        TenantResolver.setDemoTenant(value);
        updateTenantDisplay();
    }
}

// Reserved platform keywords must never render as an active tenant scope,
// even when passed explicitly via ?tenant=.
var RESERVED_TENANT_KEYWORDS = ['www', 'app', 'api', 'caan', 'admin', 'auth', 'docs', 'sms', 'demo', 'betasms', 'sms-beta', 'gap-analysis-ssp', 'localhost'];

function prettifyTenantName(slug) {
    if (typeof TenantResolver !== 'undefined' && TenantResolver.prettifySlug) {
        return TenantResolver.prettifySlug(slug);
    }
    return String(slug || '').replace(/[-_]/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
}

function getActiveTenant() {
    var tenantId = null;
    if (typeof TenantResolver !== 'undefined' && TenantResolver.getCurrentTenant) {
        tenantId = TenantResolver.getCurrentTenant();
    } else {
        tenantId = getTenantFromSubdomain();
    }
    if (tenantId && RESERVED_TENANT_KEYWORDS.indexOf(tenantId) !== -1) return null;
    return tenantId || null;
}

async function updateTenantDisplay() {
    var displayEl = document.getElementById('tenantHeaderName');
    if (!displayEl) return;
    if (developerPersonaActive) {
        displayEl.textContent = 'Developer Console (Super-Admin)';
        displayEl.classList.add('is-tenant');
        return;
    }
    var tenantId = getActiveTenant();
    if (!tenantId) {
        // Root / default platform host — no active tenant scope.
        displayEl.textContent = 'Safety Data to Safety Intelligence';
        displayEl.classList.remove('is-tenant');
        return;
    }
    var title = null;
    if (typeof TenantResolver !== 'undefined' && TenantResolver.resolveTenantTitle) {
        title = await TenantResolver.resolveTenantTitle(tenantId);
    }
    displayEl.textContent = title || prettifyTenantName(tenantId);
    displayEl.classList.add('is-tenant');
}

// ============================================================================
// PRODUCTION TENANT-MEMBERSHIP VERIFICATION — a signed-in user must belong to
// the tenant this subdomain is scoped to. SUPER_ADMIN / CAAN_SMD are
// cross-tenant by design and always allowed. Demo hosts (beta) are exempt so
// persona switching keeps working.
// ============================================================================

function isProductionHost() {
    if (window.APP_CONFIG && window.APP_CONFIG.environment) {
        return window.APP_CONFIG.environment === 'production';
    }
    var host = window.location.hostname || '';
    return host.indexOf('beta') === -1 && host !== 'localhost' && host !== '127.0.0.1';
}

function tenantMembershipError(user) {
    if (!isProductionHost()) return null;
    var role = (user && user.role) || '';
    if (role === 'SUPER_ADMIN' || role === 'CAAN_SMD') return null;
    var activeTenant = getActiveTenant();
    if (!activeTenant) return null; // root production host — no subdomain scope
    if (user.tenantId && user.tenantId !== activeTenant) {
        return 'Your account is registered under "' + user.tenantId + '". This portal is scoped to "' +
            activeTenant + '". Please sign in through your own organization\'s portal.';
    }
    return null;
}

// ============================================================================
// REDIRECT BASED ON ROLE
// ============================================================================

function redirectBasedOnRole(user) {
    var redirectUrl = getRoleDestination(user);
    console.log('Redirecting to ' + redirectUrl + ' (role=' + (user.role || 'USER') + ')');
    window.location.href = redirectUrl;
}

// ============================================================================
// PERSISTENT AUTH LISTENER — handles all auth transitions
// ============================================================================

var authRedirectInProgress = false;

function onAuthStateChanged(user) {
    // Prevent multiple simultaneous redirects
    if (authRedirectInProgress) return;
    
    var statusBox = document.getElementById('statusBox');
    var errorDiv = document.getElementById('errorMessage');
    var loginBtn = document.getElementById('loginBtn');
    var loginForm = document.getElementById('loginForm');
    
    if (!user) {
        // Show login form, hide any errors
        if (loginForm) loginForm.style.display = 'block';
        if (errorDiv) errorDiv.style.display = 'none';
        if (loginBtn) loginBtn.disabled = false;
        return;
    }
    
    // User is signed in — fetch fresh claims before redirecting
    authRedirectInProgress = true;
    user.getIdTokenResult(true).then(function(tokenResult) {
        var claims = tokenResult.claims || {};
        var role = claims.role || 'USER';
        var tenantId = claims.tenant_id || null;
        
        console.log('Authenticated as:', user.email, 'role:', role, 'tenant:', tenantId);

        // Production tenant-membership check: block cross-tenant sessions on a
        // tenant-scoped subdomain (SUPER_ADMIN / CAAN_SMD are cross-tenant).
        var membershipErr = tenantMembershipError({ uid: user.uid, email: user.email, role: role, tenantId: tenantId, claims: claims });
        if (membershipErr) {
            authRedirectInProgress = false;
            if (errorDiv) {
                errorDiv.textContent = membershipErr;
                errorDiv.style.display = 'block';
            }
            if (loginForm) loginForm.style.display = 'block';
            if (loginBtn) loginBtn.disabled = false;
            firebase.auth().signOut().catch(function() {});
            return;
        }
        
        // Check if we should redirect (skip if already on a target page)
        var currentPath = window.location.pathname;
        var isOnLoginPage = currentPath === '/login.html' || currentPath === '/';
        
        if (isOnLoginPage) {
            redirectBasedOnRole({ uid: user.uid, email: user.email, role: role, tenantId: tenantId, claims: claims });
        }
    }).catch(function(error) {
        authRedirectInProgress = false;
        // A saved session whose token can no longer be refreshed (stale or
        // invalidated refresh token, disabled user, etc.) must be cleared
        // locally — otherwise the auto-redirect keeps bouncing between the
        // login page and the dashboard forever. Network failures are NOT
        // cleared, so a transient outage cannot log anyone out.
        var code = (error && error.code) || '';
        var stale = [
            'auth/invalid-login-credentials',
            'auth/invalid-refresh-token',
            'auth/user-token-expired',
            'auth/user-disabled',
            'auth/user-not-found'
        ].indexOf(code) !== -1;
        if (stale && typeof firebase !== 'undefined' && firebase.auth && firebase.auth().signOut) {
            console.log('Clearing stale session (' + code + ') to break redirect loop');
            firebase.auth().signOut().catch(function() {});
        }
    });
}

// ============================================================================
// PAGE LOAD
// ============================================================================

document.addEventListener('DOMContentLoaded', async function() {
    // Demo persona selector (beta/demo hosts only) + tenant display resolution
    renderDemoPersonaSelector();
    await updateTenantDisplay();
    
    // Wait for Firebase SDK to be ready, then register persistent listener
    await waitForFirebase();
    firebase.auth().onAuthStateChanged(onAuthStateChanged);
});

// ============================================================================
// FORM HANDLER
// ============================================================================

document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    // Anti-bot honeypot: bots that autofill the hidden field are silently
    // dropped — no error, no redirect, no server hit.
    if (typeof InputGuard !== 'undefined' && InputGuard.honeypotTrap(this)) {
        return;
    }

    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var loginBtn = document.getElementById('loginBtn');
    var errorDiv = document.getElementById('errorMessage');
    
    errorDiv.style.display = 'none';
    loginBtn.disabled = true;
    loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
    
    try {
        var user = await signIn(email, password);
        
        if (user) {
            console.log('✅ Logged in as:', user.email);
            console.log('   Role:', user.role);
            console.log('   Tenant:', user.tenantId || 'None');

            // Production tenant-membership verification (blocked before redirect).
            var membershipErr = tenantMembershipError(user);
            if (membershipErr) {
                errorDiv.textContent = membershipErr;
                errorDiv.style.display = 'block';
                if (firebase && firebase.auth && firebase.auth().signOut) {
                    firebase.auth().signOut().catch(function() {});
                }
                return;
            }

            // The onAuthStateChanged listener will handle the redirect with fresh claims,
            // but call it directly here for immediate response
            if (developerPersonaActive) {
                // Developer / Super-Admin: always land on the admin panel regardless of
                // tenant scoping (role claim SUPER_ADMIN is verified by the panel guard).
                window.location.href = '/admin/production-setup.html';
                return;
            }
            redirectBasedOnRole(user);
        }
        
    } catch (error) {
        errorDiv.textContent = error.message || 'Invalid email or password. Please try again.';
        errorDiv.style.display = 'block';
    } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
    }
});

</script>
