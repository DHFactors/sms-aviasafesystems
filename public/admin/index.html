<!-- ============================================================================
FILE: index.html
PATH: public/admin/index.html
PURPOSE: Legacy admin portal entry point. Superseded by the standalone Super
         Admin Production Setup page (/admin/production-setup.html). Redirects
         there automatically.
AUTHOR: AviaSAFE Systems
============================================================================ -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Production Setup — AviaSAFE</title>
    <link rel="stylesheet" href="/css/variables.css">
    <style>
        body { font-family: var(--font-family); background: var(--color-bg, #f8fafc); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background:#fff; border-radius:12px; box-shadow:0 1px 6px rgba(0,0,0,.08); padding: 2.5rem 3rem; text-align:center; }
        .card .fas { color: var(--color-brand-600); font-size: 2.4rem; margin-bottom: 1rem; }
        .card h1 { color: var(--color-text-strong, #0f172a); font-size: 1.2rem; margin: 0 0 .5rem; }
        .card p { color: var(--color-text-muted, #64748b); margin: 0 0 1.25rem; }
        .spinner { display: inline-block; width: 1.1rem; height: 1.1rem; border: 2px solid var(--color-brand-200); border-top-color: var(--color-brand-600); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; margin-right: .5rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <i class="fas fa-plane"></i>
        <h1>Production Setup</h1>
        <p><span class="spinner"></span>Redirecting you to the super-admin Production Setup…</p>
        <a href="/admin/production-setup.html" style="color:var(--color-brand-600);">Continue now</a>
    </div>
    <script>window.location.replace('/admin/production-setup.html');</script>
</body>
</html>
