<!-- ============================================================================
FILE: dashboard.html
PATH: public/admin/dashboard.html
PURPOSE: Unified Super Admin Dashboard. Consolidates into a single page:
           - Test Portal   (every frontend page, grouped by module)
           - Tenant Mgmt   (governance: list + activate/suspend)
           - Production Setup (Steps 1–5, fully data-driven: regulators,
             operator tenants + regulator assignment, audit log, dummy data)
           - Audit Log     (recent seeding/regulator actions)
           - Dummy Data    (VSR/MOR/CAN/CAP/Survey seed & unseed to PostgreSQL)
         SUPER_ADMIN only. Relies on AdminUI helpers + /api/v1/admin endpoints.
AUTHOR: AviaSAFE Systems
============================================================================ -->

var ROLE_CLASS = {
    "SUPER_ADMIN": "super", "AIRLINE_ADMIN": "admin", "TENANT_ADMIN": "admin",
    "CAAN_SMD": "caan", "CAAN_INSPECTOR": "caan", "DEPT_ADMIN": "user", "USER": "user"
};
var PAGE_ROLE_LABEL = {
    super: "SUPER_ADMIN", admin: "AIRLINE_ADMIN", caan: "CAAN_SMD", user: "USER", none: "Public"
};

// ============================================================================
// AUTH — SUPER_ADMIN only
// ============================================================================

var currentUser = null;
var pendingConfirm = null; // { type:'demo', body? }

function esc(v) { return AdminUI.esc(v); }
function toast(m, t) { AdminUI.toast(m, t); }

document.addEventListener('DOMContentLoaded', async function () {
    await waitForFirebase();
    var user = await getCurrentUser();
    if (!user) { window.location.href = '/admin/login.html'; return; }
    if (user.role !== 'SUPER_ADMIN') { renderAccessDenied(); return; }

    currentUser = user;
    document.getElementById('userDisplay').textContent = user.email;
    bindNav();
    showView('view-test-portal');
});

function renderAccessDenied() {
    document.getElementById('gate').innerHTML =
        '<div class="error-state">' +
            '<i class="fas fa-lock" style="font-size:3rem;color:#dc3545;"></i>' +
            '<h2>Access Denied</h2>' +
            '<p>This page is restricted to SUPER_ADMIN users. You are signed in as <strong>' + esc((currentUser && currentUser.email) || 'a user') + '</strong>.</p>' +
            '<button class="btn btn-primary" onclick="logout()">Sign out</button>' +
        '</div>';
}

function logout() {
    firebase.auth().signOut().then(function () { window.location.href = '/'; })
        .catch(function () { window.location.href = '/'; });
}

// ============================================================================
// NAVIGATION
// ============================================================================

var VIEW_TITLES = {
    'view-test-portal': 'Test Portal',
    'view-tenant-mgmt': 'Tenant Management',
    'view-production-setup': 'Production Setup',
    'view-audit-log': 'Audit Log',
    'view-dummy-data': 'Dummy Data'
};

function bindNav() {
    document.querySelectorAll('.sidebar nav a').forEach(function (a) {
        a.addEventListener('click', function (e) {
            e.preventDefault();
            showView(a.getAttribute('data-view'));
        });
    });
}

function showView(viewId) {
    document.querySelectorAll('.sidebar nav a').forEach(function (a) {
        a.classList.toggle('active', a.getAttribute('data-view') === viewId);
    });
    document.getElementById('pageTitle').textContent = 'Super Admin · ' + (VIEW_TITLES[viewId] || '');
    closeSidebar();
    renderView(viewId);
}

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); }

function renderView(viewId) {
    var gate = document.getElementById('gate');
    if (viewId === 'view-test-portal') renderTestPortal(gate);
    else if (viewId === 'view-tenant-mgmt') renderTenantMgmt(gate);
    else if (viewId === 'view-production-setup') renderProductionSetup(gate);
    else if (viewId === 'view-audit-log') renderAuditLog(gate);
    else if (viewId === 'view-dummy-data') renderDummyData(gate);
}

// ============================================================================
// VIEW 1 — TEST PORTAL
// ============================================================================

function renderTestPortal(gate) {
    var totalPages = 0, totalReady = 0;
    PORTAL_MODULES.forEach(function (m) { m.pages.forEach(function (p) { totalPages++; if (p.status === 'ready') totalReady++; }); });

    var html = '<div class="view active">';
    html += '<div class="view-head"><div><h2><i class="fas fa-flask" style="color:var(--color-brand-600);"></i> Test Portal</h2>' +
        '<div class="sub">One-click links to every frontend page, grouped by module.</div></div>' +
        '<div class="search-box"><i class="fas fa-magnifying-glass"></i><input type="text" id="pageFilter" placeholder="Search pages..." oninput="applyFilter(this.value)"></div></div>';

    html += '<div class="stats-row">' +
        '<div class="stat-card"><div class="num">' + totalPages + '</div><div class="lbl">Pages</div></div>' +
        '<div class="stat-card"><div class="num">' + PORTAL_MODULES.length + '</div><div class="lbl">Modules</div></div>' +
        '<div class="stat-card"><div class="num">' + totalReady + '</div><div class="lbl">Ready</div></div>' +
        '<div class="stat-card"><div class="num">' + (totalPages - totalReady) + '</div><div class="lbl">Beta / Dev</div></div>' +
    '</div>';

    html += '<div class="module-grid">';
    PORTAL_MODULES.forEach(function (m) {
        html += '<div class="module-card" data-module="' + esc(m.title) + '">' +
            '<h3><i class="fas ' + m.icon + '"></i>' + esc(m.title) + '</h3>' +
            '<p class="module-sub">' + esc(m.sub || '') + '</p>';
        m.pages.forEach(function (p) {
            html += '<a class="page-link" href="' + esc(p.path) + '">' +
                '<span class="p-title">' + esc(p.title) + '<span class="p-path">' + esc(p.path) + '</span></span>' +
                '<span class="page-tags">' + roleTags(p.roles) + statusTag(p.status) + '</span></a>';
        });
        html += '</div>';
    });
    html += '</div>';
    html += '<div id="filterEmpty" class="empty-state" style="display:none;"></div>';
    html += '</div>';

    gate.innerHTML = html;
}

function roleTags(roles) {
    return (roles || []).map(function (r) {
        var cls = (ROLE_CLASS[r] || 'user');
        return '<span class="role-tag ' + cls + '">' + PAGE_ROLE_LABEL[cls] + '</span>';
    }).join('');
}
function statusTag(status) {
    return '<span class="status-badge status-' + esc(status) + '">' + esc(status) + '</span>';
}

function applyFilter(value) {
    var q = (value || '').trim().toLowerCase();
    var anyVisible = false;
    var cards = document.querySelectorAll('.module-card');
    cards.forEach(function (card) {
        var moduleTitle = (card.getAttribute('data-module') || '').toLowerCase();
        var links = card.querySelectorAll('.page-link');
        var shown = 0;
        links.forEach(function (link) {
            var text = (link.textContent || '').toLowerCase();
            var visible = !q || text.indexOf(q) !== -1 || moduleTitle.indexOf(q) !== -1;
            link.style.display = visible ? '' : 'none';
            if (visible) shown++;
        });
        card.style.display = (shown > 0) ? '' : 'none';
        if (shown > 0) anyVisible = true;
    });
    var empty = document.getElementById('filterEmpty');
    if (empty) {
        empty.style.display = q && !anyVisible ? '' : 'none';
        empty.innerHTML = q && !anyVisible ? 'No pages match "' + esc(value) + '".' : '';
    }
}

async function loadGovernance() {
    var wrap = document.getElementById('govWrap');
    if (!wrap) return;
    wrap.innerHTML = '<div class="gov-empty"><i class="fas fa-spinner fa-spin"></i> Loading tenants...</div>';
    try {
        var data = await AdminUI.apiGet('/api/v1/admin/tenants/governance');
        GOVERNANCE_TENANTS = (data && data.tenants) ? data.tenants : [];
        renderGovernance();
    } catch (err) {
        wrap.innerHTML = '<div class="gov-empty"><i class="fas fa-exclamation-triangle" style="color:#ea4335;"></i> Error loading tenants: ' + esc(err.message || 'unknown error') + '</div>';
    }
}

function renderGovernance() {
    var wrap = document.getElementById('govWrap');
    var summary = document.getElementById('govSummary');
    if (!GOVERNANCE_TENANTS.length) {
        wrap.innerHTML = '<div class="gov-empty"><i class="fas fa-building"></i> No tenants found.</div>';
        if (summary) summary.textContent = '0 tenants';
        return;
    }
    var active = GOVERNANCE_TENANTS.filter(function (t) { return t.status === 'ACTIVE'; }).length;
    var suspended = GOVERNANCE_TENANTS.filter(function (t) { return t.status === 'SUSPENDED'; }).length;
    summary.textContent = GOVERNANCE_TENANTS.length + ' total · ' + active + ' active · ' + suspended + ' suspended';

    var html = '<div style="overflow-x:auto;"><table class="gov-table"><thead><tr>' +
        '<th>Organization Name</th><th>Tenant ID</th><th>Classification</th><th>Primary Admin</th>' +
        '<th>Created</th><th>Sandbox</th><th>Status</th><th>Action</th></tr></thead><tbody>';
    GOVERNANCE_TENANTS.forEach(function (t) {
        html += '<tr><td><strong>' + esc(t.name || t.tenant_id) + '</strong></td>' +
            '<td><code>' + esc(t.tenant_id) + '</code></td>' +
            '<td>' + esc(t.classification || '—') + '</td>' +
            '<td>' + esc(t.admin_email || '—') + '</td>' +
            '<td style="white-space:nowrap;">' + fmtDate(t.created_at) + '</td>' +
            '<td>' + (t.is_beta_sandbox ? '<span class="gov-badge beta">Beta</span>' : '—') + '</td>' +
            '<td>' + badgeFor(t.status) + '</td>' +
            '<td><div class="gov-actions">' + actionButtons(t) + '</div></td></tr>';
    });
    html += '</tbody></table></div>';
    wrap.innerHTML = html;
}

function fmtDate(v) {
    if (!v) return '—';
    var d = new Date(v);
    return isNaN(d.getTime()) ? '—' : d.toLocaleString();
}

function badgeFor(status) {
    if (status === 'ACTIVE') return '<span class="badge badge-success">ACTIVE</span>';
    if (status === 'SUSPENDED') return '<span class="badge badge-danger">SUSPENDED</span>';
    return '<span class="badge badge-warn">PENDING_REVIEW</span>';
}

function actionButtons(row) {
    var tid = esc(row.tenant_id);
    if (row.status === 'ACTIVE') {
        return '<button class="btn btn-danger btn-sm" onclick="govToggle(\'' + tid + '\',\'SUSPENDED\')"><i class="fas fa-pause"></i> Suspend</button>';
    }
    if (row.status === 'SUSPENDED') {
        return '<button class="btn btn-success btn-sm" onclick="govToggle(\'' + tid + '\',\'ACTIVE\')"><i class="fas fa-play"></i> Activate</button>';
    }
    return '<button class="btn btn-success btn-sm" onclick="govToggle(\'' + tid + '\',\'ACTIVE\')"><i class="fas fa-check"></i> Approve</button> ' +
        '<button class="btn btn-danger btn-sm" onclick="govToggle(\'' + tid + '\',\'SUSPENDED\')"><i class="fas fa-pause"></i> Suspend</button>';
}

async function govToggle(tenantId, newStatus) {
    var row = null;
    GOVERNANCE_TENANTS.forEach(function (t) { if (t.tenant_id === tenantId) row = t; });
    var label = row ? (row.name || row.tenant_id) : tenantId;
    var verb = newStatus === 'ACTIVE' ? 'Activate' : 'Suspend';
    var msg = newStatus === 'ACTIVE'
        ? 'Reactivate tenant "' + label + '"? Its users will regain access immediately.'
        : 'Suspend tenant "' + label + '"? All of its users will be locked out immediately.';
    if (!window.confirm(msg)) return;
    try {
        var updated = await ApiClient.patch('/api/v1/admin/tenants/' + encodeURIComponent(tenantId) + '/status', { status: newStatus });
        var t = (updated && updated.tenant) ? updated.tenant : null;
        if (t) {
            for (var i = 0; i < GOVERNANCE_TENANTS.length; i++) if (GOVERNANCE_TENANTS[i].tenant_id === t.tenant_id) { GOVERNANCE_TENANTS[i] = t; break; }
        } else {
            await loadGovernance();
        }
        renderGovernance();
        toast('Tenant "' + label + '" ' + (newStatus === 'ACTIVE' ? 'activated' : 'suspended'), 'success');
    } catch (err) {
        toast('Error: ' + (err.message || 'failed'), 'error');
    }
}

async function createRegulator(e) {
    e.preventDefault();
    var payload = {
        setup_key: AdminUI.ensureSetupKey(),
        regulator: {
            id: document.getElementById('regId').value.trim().toLowerCase(),
            name: document.getElementById('regName').value.trim(),
            short_name: document.getElementById('regShort').value.trim(),
            country: document.getElementById('regCountry').value.trim().toUpperCase(),
            country_name: document.getElementById('regCountryName').value.trim(),
            domain: document.getElementById('regDomain').value.trim(),
            operator_tenant_ids: document.getElementById('regOperators').value.split(',').map(function (s) { return s.trim(); }).filter(Boolean),
        }
    };

        var resp = await AdminUI.apiPost('/api/v1/admin/regulators', payload);

        setup_key: AdminUI.ensureSetupKey(),

function bulkImport() {
    var ta = document.getElementById('bulkTextarea');
    if (ta.style.display === 'none') { ta.style.display = 'block'; return; }
    var text = ta.value.trim();
    if (!text) { toast('Paste CSV or JSON into the box first.', 'error'); return; }
    var body = { setup_key: AdminUI.ensureSetupKey() };
    if (text.charAt(0) === '[') {
        try { body.records = JSON.parse(text); }
        catch (err) { toast('Invalid JSON: ' + err.message, 'error'); return; }
    } else { body.csv = text; }
    AdminUI.apiPost('/api/v1/admin/tenants/bulk', body).then(function (resp) {
        toast('Bulk import: ' + resp.ok + '/' + resp.total + ' created.', resp.ok === resp.total ? 'success' : 'warn');
        var failed = (resp.results || []).filter(function (r) { return r.status !== 'ok'; });
        if (failed.length) {
            window.alert('Bulk import finished. ' + resp.ok + '/' + resp.total + ' created.\n\nFailures:\n' +
                failed.map(function (r) { return (r.tenant_id || '?') + ' — ' + (r.detail || r.status); }).join('\n'));
        }
        ta.style.display = 'none'; ta.value = '';
        loadExistingTenants();
    }).catch(function (err) { toast('Bulk import failed: ' + err.message, 'error'); });
}

function demoData(action) {
    var kinds = Array.prototype.slice.call(document.querySelectorAll('.demo-kind:checked')).map(function (cb) { return cb.value; });
    if (!kinds.length) { toast('Select at least one data type (VSR/MOR/CAN/CAP/Survey).', 'error'); return; }
    var scope = document.querySelector('input[name=demoScope]:checked').value;
    var body = { setup_key: AdminUI.ensureSetupKey(), action: action, kinds: kinds };
    if (scope === 'one') {
        var tid = document.getElementById('demoTenantSelect').value;
        if (!tid) { toast('Select a tenant.', 'error'); return; }
        body.all = false; body.tenant_ids = [tid];
    } else { body.all = true; }

    var verb = action === 'seed' ? 'Seed' : 'Unseed';
    var quantLabel = '';
    if (action === 'seed') {
        body.counts = {};
        kinds.forEach(function (k) {
            var input = document.querySelector('.demo-count[data-kind="' + k + '"]');
            var val = input ? parseInt(input.value, 10) : NaN;
            body.counts[k] = (isFinite(val) && val >= 1) ? Math.min(val, 500) : NaN;
        });
        quantLabel = ' — ' + kinds.map(function (k) {
            var v = body.counts[k];
            return k.toUpperCase() + ' x' + (isFinite(v) ? v : '?');
        }).join(', ');
    }

    openConfirm(
        'Confirm ' + verb,
        '<strong>' + verb + ' dummy ' + kinds.map(function (k) { return k.toUpperCase(); }).join(' / ') + quantLabel + '</strong>' +
        (scope === 'one' ? ' for tenant <code>' + esc(body.tenant_ids[0]) + '</code>' : ' for <strong>all tenants</strong>') +
        ' per tenant. Unseed removes only the documents created by this seeder — real data is untouched.',
        { type: 'demo', body: body }
    );
}

async function execDemo(body) {
    var area = document.getElementById('demoDataArea');
    if (area) area.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> ' +
        (body.action === 'seed' ? 'Seeding' : 'Unseeding') + ' dummy data...</div>';
    try {
        var resp = await AdminUI.apiPost('/api/v1/admin/demo-data', body);
        var rows = (resp.results || []).map(function (r) {
            var payload = r.seeded || r.removed || {};
            var detail = Object.keys(payload).map(function (k) { return k.toUpperCase() + '=' + payload[k]; }).join(', ');
            return '<tr><td><code>' + esc(r.tenant_id) + '</code></td>' +
                '<td>' + (r.error ? '<span class="badge badge-danger">' + esc(r.error) + '</span>' : esc(detail || 'ok')) + '</td></tr>';
        }).join('');
        if (area) {
            area.innerHTML = '<div class="status-box success"><strong>' +
                (body.action === 'seed' ? 'Seed complete' : 'Unseed complete') + '</strong> — ' + rows.length + ' tenant(s) processed.</div>' +
                (rows ? '<div style="overflow-x:auto;"><table class="admin-table"><thead><tr><th>Tenant</th><th>Result</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '');
        }
        loadAuditLog();
    } catch (err) {
        if (area) area.innerHTML = '<div class="status-box error">' + esc(err.message) + '</div>';
        toast((body.action === 'seed' ? 'Seed' : 'Unseed') + ' failed: ' + err.message, 'error');
    }
}

// ============================================================================
// EXISTING REGULATORS & TENANTS (View 3, sections F & G)
// ============================================================================

async function loadExistingRegulators() {
    var el = document.getElementById('regulatorList');
    if (!el) return;
    el.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';
    try {
        var resp = await AdminUI.apiGet('/api/v1/admin/regulators');
        var regs = resp.regulators || [];
        if (!regs.length) { el.innerHTML = '<div class="empty-state">No regulators yet.</div>'; return; }
        el.innerHTML = '<div style="overflow-x:auto;"><table class="admin-table"><thead><tr>' +
            '<th>Regulator</th><th>Country</th><th>Status</th><th>Operators</th></tr></thead><tbody>' +
            regs.map(function (r) {
                var ops = r.operator_tenant_ids || [];
                return '<tr><td><strong>' + esc(r.name || r.id) + '</strong><br><code>' + esc(r.id) + '</code></td>' +
                    '<td>' + esc(r.country_name || r.country || r.country_code || '—') + '</td>' +
                    '<td>' + regulatorBadge(r.status || (r.active ? 'active' : 'inactive')) + '</td>' +
                    '<td>' + (ops.length ? ops.map(esc).join(', ') : '—') + '</td></tr>';
            }).join('') + '</tbody></table></div>';
    } catch (err) { el.innerHTML = '<div class="status-box error">' + esc(err.message) + '</div>'; }
}

async function loadExistingTenants() {
    var el = document.getElementById('tenantList');
    if (!el) return;
    el.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';
    try {
        var resp = await AdminUI.apiGet('/api/v1/admin/tenants');
        var tenants = resp.tenants || [];
        EXISTING_TENANTS = tenants;
        if (!tenants.length) { el.innerHTML = '<div class="empty-state">No tenants yet.</div>'; return; }
        el.innerHTML = '<div style="overflow-x:auto;"><table class="admin-table"><thead><tr>' +
            '<th>Tenant</th><th>Regulator</th><th>Country</th><th>Status</th><th>Payment</th><th>Contract</th>' +
            '<th>Surveys</th><th>Hazards</th><th>Reports</th><th>CANs</th><th>Actions</th></tr></thead><tbody>' +
            tenants.map(buildTenantRow).join('') + '</tbody></table></div>';
    } catch (err) { el.innerHTML = '<div class="status-box error">' + esc(err.message) + '</div>'; }
}

async function loadSeedTenants(selectId) {
    var sel = document.getElementById(selectId);
    if (!sel) return;
    try {
        var resp = await AdminUI.apiGet('/api/v1/admin/tenants');
        var tenants = resp.tenants || [];
        var prev = sel.value;
        sel.innerHTML = '<option value="__all__">All Step-2 tenants</option>' +
            tenants.map(function (t) {
                return '<option value="' + esc(t.id) + '">' + esc(t.name || t.id) + ' (' + esc(t.id) + ')</option>';
            }).join('');
        if (prev && prev !== '__all__' && tenants.some(function (t) { return t.id === prev; })) sel.value = prev;
    } catch (err) { console.error('loadSeedTenants failed', err); }
}

async function seedPsoe() {
    var area = document.getElementById('psoeArea');
    if (!area) return;
    area.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Seeding PSOE baselines...</div>';
    var sel = document.getElementById('psoeTenant');
    var val = sel ? sel.value : '__all__';
    var force = !!(document.getElementById('psoeForce') && document.getElementById('psoeForce').checked);
    var body = { setup_key: AdminUI.ensureSetupKey(), force: force };
    if (val && val !== '__all__') body.tenant_ids = [val];
    else body.all = true;
    try {
        var resp = await AdminUI.apiPost('/api/v1/admin/psoe', body);
        var results = (resp.results || []).map(function (r) {
            if (r.error) return '<li>' + esc(r.tenant_id || '?') + ' — error: ' + esc(r.error) + '</li>';
            var count = (r.assessments || []).length;
            return '<li>' + esc(r.tenant_id) + ' — ' + count + ' assessment(s)</li>';
        }).join('');
        area.innerHTML = '<div class="status-box success"><strong>PSOE seeding complete.</strong><ul style="margin:10px 0 0 18px;">' + results + '</ul></div>';
        toast('PSOE baselines seeded.', 'success');
        loadAuditLog();
    } catch (err) {
        area.innerHTML = '<div class="status-box error">PSOE seeding failed: ' + esc(err.message) + '</div>';
    }
}

async function seedStateRisk() {
    var area = document.getElementById('stateRiskArea');
    if (!area) return;
    area.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Seeding state risk reference...</div>';
    try {
        var resp = await AdminUI.apiPost('/api/v1/admin/state-risk', { setup_key: AdminUI.ensureSetupKey() });
        area.innerHTML = '<div class="status-box success"><strong>State risk reference seeded:</strong> ' +
            (resp.categories || resp.result && resp.result.categories || 0) + ' ICAO categories.</div>';
        toast('State risk reference seeded.', 'success');
        loadAuditLog();
    } catch (err) {
        area.innerHTML = '<div class="status-box error">State risk seeding failed: ' + esc(err.message) + '</div>';
    }
}

function buildTenantRow(t) {
    var c = t.counts || {};
    var reg = t.regulator_name
        ? esc(t.regulator_name) + (t.regulator_country ? ' <span class="sub">(' + esc(t.regulator_country) + ')</span>' : '')
        : esc(t.regulator_id || '—');
    var contract = (t.contract && (t.contract.start_date || t.contract.end_date))
        ? esc((t.contract.start_date || '?') + ' \u2192 ' + (t.contract.end_date || '?'))
        : '—';
    var st = t.status || (t.active === false ? 'INACTIVE' : 'ACTIVE');
    return '<tr><td><strong>' + esc(t.name || t.id) + '</strong><br><code>' + esc(t.id) + '</code></td>' +
        '<td>' + reg + '</td>' +
        '<td>' + esc(t.country || '—') + '</td>' +
        '<td>' + statusBadge(st) + '</td>' +
        '<td>' + paymentBadge(t.payment_status) + '</td>' +
        '<td style="white-space:nowrap;">' + contract + '</td>' +
        '<td>' + (c.surveys || 0) + '</td><td>' + (c.hazards || 0) + '</td><td>' + (c.reports || 0) + '</td><td>' + (c.cans || 0) + '</td>' +
        '<td><button class="btn btn-outline btn-sm" onclick="openManageTenant(\'' + esc(t.id) + '\')"><i class="fas fa-sliders"></i> Manage</button></td></tr>';
}

function statusBadge(st) {
    st = (st || '').toUpperCase();
    if (st === 'DEMO') return '<span class="badge badge-demo">DEMO</span>';
    if (st === 'TRIAL') return '<span class="badge badge-trial">TRIAL</span>';
    if (st === 'ACTIVE') return '<span class="badge badge-active">ACTIVE</span>';
    if (st === 'INACTIVE') return '<span class="badge badge-inactive">INACTIVE</span>';
    return '<span class="badge badge-info">' + esc(st || '—') + '</span>';
}

function paymentBadge(p) {
    p = (p || '').toLowerCase();
    if (p === 'paid') return '<span class="badge badge-paid">Paid</span>';
    if (p === 'unpaid') return '<span class="badge badge-unpaid">Unpaid</span>';
    if (p === 'not_applicable' || p === 'n/a' || p === 'na') return '<span class="badge badge-notapp">N/A</span>';
    return '<span class="badge badge-info">' + esc(p || '—') + '</span>';
}

function regulatorBadge(st) {
    st = (st || '').toLowerCase();
    if (st === 'active') return '<span class="badge badge-success">active</span>';
    return '<span class="badge badge-danger">inactive</span>';
}

// ============================================================================
// MANAGE TENANT MODAL — lifecycle status / payment / contract
// ============================================================================

var MANAGE_TENANT_ID = null;

function openManageTenant(id) {
    MANAGE_TENANT_ID = id;
    var t = null;
    EXISTING_TENANTS.forEach(function (r) { if (r.id === id) t = r; });
    document.getElementById('manageTenantLabel').textContent = t
        ? (t.name || id) + ' \u00b7 ' + id
        : id;
    var contract = (t && t.contract) || {};
    var st = (t && (t.status || '')) || '';
    document.getElementById('mmStatus').value = st.toLowerCase() || 'active';
    var pay = (t && (t.payment_status || '')) || '';
    document.getElementById('mmPayment').value = pay.toLowerCase();
    document.getElementById('mmStart').value = (contract.start_date || '').slice(0, 10);
    document.getElementById('mmEnd').value = (contract.end_date || '').slice(0, 10);
    document.getElementById('mmTrialEnd').value = (contract.trial_end_date || '').slice(0, 10);
    document.getElementById('manageModal').style.display = 'flex';
}

function closeManageTenant() {
    document.getElementById('manageModal').style.display = 'none';
    MANAGE_TENANT_ID = null;
}

async function saveManageTenant() {
    if (!MANAGE_TENANT_ID) return;
    var payload = {
        setup_key: AdminUI.ensureSetupKey(),
        status: document.getElementById('mmStatus').value || null,
        payment_status: document.getElementById('mmPayment').value || null,
    };
    var start = document.getElementById('mmStart').value;
    var end = document.getElementById('mmEnd').value;
    var trialEnd = document.getElementById('mmTrialEnd').value;
    if (start) payload.contract_start_date = start;
    if (end) payload.contract_end_date = end;
    if (trialEnd) payload.trial_end_date = trialEnd;
    var tenantId = MANAGE_TENANT_ID;
    try {
        await AdminUI.apiPost('/api/v1/admin/tenants/' + encodeURIComponent(tenantId) + '/status', payload);
        toast('Tenant "' + tenantId + '" updated.', 'success');
        closeManageTenant();
        loadExistingTenants();
    } catch (err) {
        toast('Error: ' + (err.message || 'failed'), 'error');
    }
}

// ============================================================================
// SHARED CONFIRM MODAL
// ============================================================================

function openConfirm(title, html, action) {
    pendingConfirm = action;
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmText').innerHTML = html;
    document.getElementById('confirmModal').style.display = 'flex';
}

function closeConfirm() {
    document.getElementById('confirmModal').style.display = 'none';
    pendingConfirm = null;
}

document.getElementById('confirmOkBtn').addEventListener('click', function () {
    var action = pendingConfirm;
    document.getElementById('confirmModal').style.display = 'none';
    pendingConfirm = null;
    if (!action) return;
    if (action.type === 'demo') execDemo(action.body);
});
</script>
