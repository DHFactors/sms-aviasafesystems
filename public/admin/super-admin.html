<!-- ============================================================================
FILE: public/admin/super-admin.html
PATH: public/admin/super-admin.html
PURPOSE: Super Admin hub — navigation to the admin modules and a PSOE Audit
         entry point. SUPER_ADMIN only.
AUTHOR:  AviaSAFE Systems
============================================================================ -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin — AviaSAFE</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="/js/firebase.js?v=4.0.1"></script>
    <script src="/js/api/client.js"></script>

    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background: #f1f5f9; color: #1e293b; margin: 0; }
        .admin-shell { min-height: 100vh; display: flex; flex-direction: column; }
        .topbar {
            background: linear-gradient(135deg, #051a26, #0b3a4d); color: #fff; padding: 14px 26px;
            display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
            box-shadow: 0 2px 10px rgba(0,0,0,.18);
        }
        .tb-left { display: flex; align-items: center; gap: 12px; }
        .tb-brand { font-weight: 800; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
        .tb-brand i { color: #4fc3f7; }
        .tb-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .tb-actions a.nav-link {
            color: #cbd5e1; text-decoration: none; font-size: .82rem; padding: 6px 12px; border-radius: 8px;
            transition: background .15s, color .15s;
        }
        .tb-actions a.nav-link:hover, .tb-actions a.nav-link.active { background: rgba(255,255,255,.12); color: #fff; }
        .user-badge { background: rgba(255,255,255,.14); color: #fff; padding: .3rem 1rem; border-radius: 999px; font-size: .82rem; }
        .user-badge .role-chip { background: #4fc3f7; color: #072535; padding: .02rem .5rem; border-radius: 999px; margin-right: .4rem; font-weight: 700; }

        .content-area { padding: 26px; flex: 1; max-width: 1080px; width: 100%; margin: 0 auto; box-sizing: border-box; }
        .page-head h1 { margin: 0 0 4px; font-size: 1.5rem; color: #0f172a; }
        .page-head .sub { color: #64748b; font-size: .9rem; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .admin-tile {
            background: #fff; border-radius: 14px; padding: 24px; text-decoration: none; display: block;
            box-shadow: 0 1px 4px rgba(15,23,42,.08); border: 1px solid #eef2f6;
            transition: transform .12s, box-shadow .12s; color: inherit;
        }
        .admin-tile:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(15,23,42,.12); }
        .admin-tile .tile-icon { font-size: 2rem; color: #0ea5e9; margin-bottom: .6rem; }
        .admin-tile h2 { margin: 0 0 4px; font-size: 1.02rem; color: #0f172a; }
        .admin-tile p { margin: 0; color: #64748b; font-size: .84rem; line-height: 1.5; }
        .admin-tile .tile-go { margin-top: .8rem; font-weight: 700; font-size: .8rem; color: #0ea5e9; }

        .side-foot { text-align: center; color: #94a3b8; font-size: .8rem; padding: 20px 0 26px; }
        .side-foot i { color: #e2574c; }
    </style>
</head>
<body>

<div class="admin-shell">
    <div class="topbar">
        <div class="tb-left">
            <span class="tb-brand"><i class="fas fa-plane"></i> AviaSAFE Admin</span>
            <span class="page-title" style="font-weight:600;font-size:.9rem;color:#bcd6e3;">Super Admin</span>
        </div>
        <div class="tb-actions" id="topNav"></div>
    </div>

    <div class="content-area">
        <div class="page-head">
            <h1><i class="fas fa-user-shield" style="color:#0ea5e9;"></i> Super Admin</h1>
            <div class="sub">Administrative modules for production setup, PSOE audit &amp; surveillance, and platform management.</div>
        </div>

        <div class="grid" id="moduleGrid"></div>

        <div class="side-foot">Made with <i class="fas fa-heart"></i> from Nepal</div>
    </div>
</div>

<script>
var NAV_ITEMS = [
    { label: 'Production Setup', path: '/admin/production-setup.html', icon: 'fa-cogs',
      desc: 'State regulator, operator tenants, audit log, dummy data and PSOE baselines.' },
    { label: 'PSOE Audit', path: '/admin/psoe-audit.html', icon: 'fa-clipboard-check',
      desc: 'CAAN Appendix 10 surveillance assessments — questions, scoring, findings and reports.' },
    { label: 'Audit Log', path: '/admin/audit-log.html', icon: 'fa-clipboard-list',
      desc: 'Platform audit trail of admin actions and data changes.' },
    { label: 'User Management', path: '/admin/user-management.html', icon: 'fa-users-gear',
      desc: 'Tenant users, roles and account management.' },
];

function esc(v) {
    return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

document.addEventListener('DOMContentLoaded', async function () {
    await waitForFirebase();
    var user = await getCurrentUser();
    if (!user) { window.location.href = '/admin/login.html'; return; }
    if (user.role !== 'SUPER_ADMIN') {
        var gate = document.createElement('div');
        gate.style.cssText = 'max-width:520px;margin:5rem auto;text-align:center;background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.08);padding:3rem 2rem;';
        gate.innerHTML =
            '<i class="fas fa-lock" style="font-size:3rem;color:#dc3545;"></i>' +
            '<h2 style="color:#0f172a;margin:1rem 0 .5rem;">Access Denied</h2>' +
            '<p>This page is restricted to SUPER_ADMIN users. You are signed in as <strong>' + esc(user.email) + '</strong>.</p>' +
            '<button class="btn btn-primary" onclick="logout()">Sign out</button>';
        document.body.appendChild(gate);
        return;
    }

    document.getElementById('topNav').innerHTML =
        NAV_ITEMS.map(function (n) {
            return '<a class="nav-link' + (n.path === '/admin/super-admin.html' ? ' active' : '') + '" href="' + n.path + '">' +
                '<i class="fas ' + n.icon + '"></i> ' + n.label + '</a>';
        }).join('') +
        '<span class="user-badge"><span class="role-chip">SUPER_ADMIN</span><span>' + esc(user.email) + '</span></span>' +
        '<button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>';

    document.getElementById('moduleGrid').innerHTML = NAV_ITEMS.map(function (n) {
        return '<a class="admin-tile" href="' + n.path + '">' +
            '<div class="tile-icon"><i class="fas ' + n.icon + '"></i></div>' +
            '<h2>' + esc(n.label) + '</h2>' +
            '<p>' + esc(n.desc) + '</p>' +
            '<div class="tile-go">Open &nbsp;<i class="fas fa-arrow-right"></i></div></a>';
    }).join('');
});

function logout() {
    firebase.auth().signOut().then(function () { window.location.href = '/'; })
        .catch(function () { window.location.href = '/'; });
}
</script>
</body>
</html>
