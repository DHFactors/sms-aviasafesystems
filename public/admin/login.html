<!-- ============================================================================
FILE: login.html
PATH: public/admin/login.html
VERSION: 1.0.0
DATE CREATED: 2026-08-07
PURPOSE: Developer (SUPER_ADMIN) login. Separate from the tenant login page.
         Signs in with Firebase Auth, validates the SUPER_ADMIN custom claim,
         and redirects to /admin/production-setup.html on success.
AUTHOR: AviaSAFE Systems
============================================================================ -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Login — AviaSAFE</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-check-compat.js"></script>
    <script src="/js/firebase.js"></script>
</head>
<body class="admin-body">

<div class="admin-login-wrap">
    <div class="admin-login-card">
        <div class="logo">
            <i class="fas fa-crown"></i>
            <h1>Developer Login</h1>
            <p>AviaSAFE Super-Admin Panel</p>
        </div>

        <form id="devLoginForm" autocomplete="off">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="smd@caanepal.gov.np" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <div id="errorMessage" class="error-message"></div>
            <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%;justify-content:center;">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <a class="back-link" href="/login.html">← Tenant Login</a>
        <a class="back-link" href="/">← Back to Home</a>
    </div>
</div>

<script src="/js/api/client.js"></script>
<script>
// ============================================================================
// DEVELOPER LOGIN — SUPER_ADMIN ONLY
// ============================================================================

document.addEventListener('DOMContentLoaded', function () {
    // If already signed in as SUPER_ADMIN, go straight to the panel.
    waitForFirebase().then(function () {
        firebase.auth().onAuthStateChanged(function (user) {
            if (!user) return;
            user.getIdTokenResult(true).then(function (tokenResult) {
                var claims = tokenResult.claims || {};
                if (claims.role === 'SUPER_ADMIN') {
                    window.location.href = '/admin/production-setup.html';
                } else {
                    document.getElementById('errorMessage').textContent =
                        'This account is not a SUPER_ADMIN (role: ' + (claims.role || 'none') + ').';
                    document.getElementById('errorMessage').style.display = 'block';
                    firebase.auth().signOut();
                }
            }).catch(function () {});
        });
    });
});

document.getElementById('devLoginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var btn = document.getElementById('loginBtn');
    var err = document.getElementById('errorMessage');
    err.style.display = 'none';
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

    try {
        await firebase.auth().signInWithEmailAndPassword(email, password);
        var user = firebase.auth().currentUser;
        var tokenResult = await user.getIdTokenResult(true);
        var claims = tokenResult.claims || {};
        if (claims.role === 'SUPER_ADMIN') {
            window.location.href = '/admin/production-setup.html';
        } else {
            err.textContent = 'Access denied: SUPER_ADMIN role required (your role: ' + (claims.role || 'none') + ').';
            err.style.display = 'block';
            firebase.auth().signOut();
        }
    } catch (error) {
        err.textContent = error.message || 'Invalid email or password.';
        err.style.display = 'block';
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
    }
});
</script>

</body>
</html>
