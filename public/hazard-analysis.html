<!--
==============================================================================
File: frontend/hazard-analysis.html
Description: Interactive Hazard Analysis, ICAO 5x5 Risk Tolerability Matrix,
             and DoD HFACS 7.0 Nanocode Root Cause Analysis (RCA) Interface.
==============================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AviaSAFE — Hazard Analysis & HFACS RCA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/styles/global.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/dashboard-responsive.css">
  <link rel="stylesheet" href="/css/shell.css">
  <style>
    .ha-layout { max-width: 1200px; margin: 0 auto; padding: 24px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card { background: var(--color-surface, var(--color-gray-100)); border: 1px solid var(--color-border); border-radius: var(--border-radius-lg, 12px); padding: 20px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06); }
    .card h2 { margin-top: 0; font-size: 16px; border-bottom: 1px solid var(--color-border); padding-bottom: 10px; color: var(--color-deep-teal-900, #0b2a42); }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: var(--color-muted, #64748b); margin-bottom: 6px; font-weight: 600; }
    input:not([type="submit"]), select, textarea { width: 100%; background: #fff; border: 1px solid var(--color-border); color: var(--color-deep-teal-900, #0b2a42); padding: 10px 12px; border-radius: 6px; font-family: var(--font-sans, 'Inter', system-ui, sans-serif); }
    input:not([type="submit"]):focus, select:focus, textarea:focus { outline: none; border-color: var(--color-brand-500, #1a6b8a); }
    .matrix-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 10px; font-family: var(--font-mono, monospace); font-size: 12px; text-align: center; }
    .matrix-cell { padding: 8px 4px; border-radius: 4px; font-weight: 700; }
    .cell-intolerable { background: rgba(217, 99, 79, 0.25); color: #d9634f; border: 1px solid #d9634f; }
    .cell-tolerable { background: rgba(232, 163, 61, 0.25); color: #b97c18; border: 1px solid #e8a33d; }
    .cell-acceptable { background: rgba(127, 191, 106, 0.25); color: #2e7d32; border: 1px solid #7fbf6a; }
    .btn { background: var(--color-brand-600, #1a6b8a); color: #fff; font-weight: 700; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; }
    .btn:hover { opacity: 0.9; }
    @media (max-width: 860px) { .ha-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app-shell" id="appShell">
  <div class="ha-layout">
    <!-- Hazard Definition & Risk Evaluation -->
    <div class="card">
      <h2>1. Hazard Definition & ICAO Matrix</h2>
      <div class="form-group">
        <label>HAZARD TITLE</label>
        <input type="text" id="hazardTitle" placeholder="e.g., Unstabilized approach in tailwind conditions">
      </div>
      <div class="form-group">
        <label>FUNCTIONAL AREA</label>
        <select id="functionalArea">
          <option value="flight_operations">Flight Operations</option>
          <option value="maintenance_145">Maintenance (Part-145)</option>
          <option value="camo">Continuing Airworthiness (CAMO)</option>
          <option value="ground_ops">Ground Operations</option>
        </select>
      </div>
      <div class="form-group">
        <label>SEVERITY (1 to 5) & PROBABILITY (A to E)</label>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <select id="severitySelect">
            <option value="5">5 - Catastrophic</option>
            <option value="4" selected>4 - Hazardous</option>
            <option value="3">3 - Major</option>
            <option value="2">2 - Minor</option>
            <option value="1">1 - Negligible</option>
          </select>
          <select id="probabilitySelect">
            <option value="A">A - Frequent</option>
            <option value="B">B - Occasional</option>
            <option value="C">C - Remote</option>
            <option value="D" selected>D - Improbable</option>
            <option value="E">E - Extremely Improbable</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>CALCULATED TOLERABILITY INDEX</label>
        <div id="riskIndexDisplay" style="font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--amber);">4D — Tolerable</div>
      </div>
    </div>

    <!-- DoD HFACS 7.0 Nanocode RCA Selector -->
    <div class="card">
      <h2>2. Root Cause Analysis (HFACS 7.0 Nanocode)</h2>
      <div class="form-group">
        <label>HFACS TIER & CATEGORY</label>
        <select id="hfacsCat">
          <option value="ACT">Tier 1: Unsafe Acts (AE100-200 / AV000)</option>
          <option value="PRECOND" selected>Tier 2: Preconditions (PE100-200 / PC100-500 / PP100)</option>
          <option value="SUPER">Tier 3: Supervisory Influences (SV000 / SP000 / SI000)</option>
          <option value="ORG">Tier 4: Organizational Influences (OR000 / OS000 / OP000 / OC000)</option>
        </select>
      </div>
      <div class="form-group">
        <label>NANOCODE SELECTION</label>
        <select id="nanocodeSelect">
          <option value="PE101">PE101 — Environmental Conditions Affecting Vision</option>
          <option value="AE104">AE104 — Over-Controlled/Under-Controlled Aircraft</option>
          <option value="SP001">SP001 — Directed Task Beyond Personnel Capabilities</option>
          <option value="OP001">OP001 — Pace of Ops-tempo/Workload</option>
        </select>
      </div>
      <div class="form-group">
        <label>CAUSAL FACTOR NARRATIVE</label>
        <textarea id="rcaNarrative" rows="4" placeholder="Detail how this causal factor contributed directly to the hazard..."></textarea>
      </div>
      <button class="btn" style="width: 100%;">Save Hazard & RCA Factors</button>
    </div>
  </div>
</div>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="/js/firebase.js?v=4.0.1"></script>
  <script>
    window.SHELL_CONFIG = {
        brand: 'AviaSAFE',
        roleLabel: 'Operator Safety Dashboard',
        heroTitle: 'Hazard Analysis & RCA',
        heroSubtitle: 'ICAO 5x5 Tolerability Matrix · DoD HFACS 7.0 Nanocode RCA',
    };
  </script>
  <script src="/js/nav-config.js"></script>
  <script src="/js/shell.js"></script>
</body>
</html>
