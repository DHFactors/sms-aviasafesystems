name: Beta Reset & Seed (Manual — sms-db-beta only)

on:
  workflow_dispatch:
    inputs:
      database_id:
        description: 'Must be exactly sms-db-beta (hard-fail otherwise)'
        required: true
        default: 'sms-db-beta'
        type: string
      confirm_purge:
        description: 'Type CONFIRM-BETA-PURGE to execute destructive purge/seed (dry-run otherwise)'
        required: false
        default: ''
        type: string

# Never run on push/PR — manual dispatch only, protected by beta environment
permissions:
  contents: read

jobs:
  beta-reset-seed:
    runs-on: ubuntu-latest
    # Requires GitHub Environment "beta" with protection rule: required reviewers
    # (manual approval). This prevents accidental execution from normal pushes.
    environment: beta
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate database_id is exactly sms-db-beta
        run: |
          if [ "${{ inputs.database_id }}" != "sms-db-beta" ]; then
            echo "::error::Refusing to run: --database-id must be exactly 'sms-db-beta' (got '${{ inputs.database_id }}')"
            echo "This workflow NEVER touches sms-db (production)."
            exit 1
          fi
          echo "Database ID confirmed: sms-db-beta"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Dry-run — count and preview (no writes)
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_DATABASE_ID: sms-db-beta
        run: |
          echo "Running dry-run (no --execute)..."
          python backend/scripts/setup_two_tenants_beta.py --database-id sms-db-beta
          echo "Dry-run complete. Review log in backend/scripts/logs/"

      - name: Execute purge & seed (requires explicit confirmation)
        if: ${{ inputs.confirm_purge == 'CONFIRM-BETA-PURGE' }}
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_DATABASE_ID: sms-db-beta
        run: |
          echo "Explicit confirmation received — executing on sms-db-beta..."
          python backend/scripts/setup_two_tenants_beta.py --database-id sms-db-beta --execute --confirm-beta-purge
          echo "Execution complete. Check JSON summary in backend/scripts/logs/"

      - name: Blocked — no confirmation
        if: ${{ inputs.confirm_purge != 'CONFIRM-BETA-PURGE' }}
        run: |
          echo "No destructive execution — dry-run only. To purge, dispatch again with confirm_purge = CONFIRM-BETA-PURGE"
