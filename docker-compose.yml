version: "3.9"

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: aviasafe-api:latest
    container_name: aviasafe-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - HOST=0.0.0.0
      - PORT=${PORT:-8000}
      - FIREBASE_DATABASE_ID=sms-db-beta
      - ENVIRONMENT=development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # Cloud Run-compatible alternative (uses Cloud Run's built-in health checks)
  # Deploy: gcloud run deploy aviasafe-api --source ./backend --region us-central1
