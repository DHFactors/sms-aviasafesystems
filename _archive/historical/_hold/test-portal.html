<!-- ============================================================================
FILE: test-portal.html
PATH: public/test-portal.html
PURPOSE: Convenience redirect stub. The SUPER_ADMIN Dashboard at
         /admin/dashboard.html hosts the Test Portal view (and the other
         standalone admin pages); this root-level page forwards there so
         sms.aviasafesystems.com/test-portal.html also resolves.
AUTHOR: AviaSAFE Systems
============================================================================ -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting — AviaSAFE Admin</title>
    <meta http-equiv="refresh" content="0; url=/admin/dashboard.html">
    <script>
        // Canonical redirect target; runs even if the meta refresh is not applied.
        window.location.replace('/admin/dashboard.html');
    </script>
</head>
<body>
    <noscript>
        <p>Redirecting to the <a href="/admin/dashboard.html">Super Admin Dashboard</a>…</p>
    </noscript>
</body>
</html>
